<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HyroxTrack</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent2:#1f6feb;
  --green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;
  --yellow:#e3b341;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%;overscroll-behavior:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:60px;}

.app{display:flex;flex-direction:column;min-height:100vh;padding-bottom:calc(60px + var(--safe-bottom));}
.topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.topbar h1{font-size:16px;font-weight:700;white-space:nowrap;}
.topbar-right{display:flex;gap:6px;align-items:center;}
.topbar-btn{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--border);}
.topbar-btn:active{background:var(--accent2);}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);}
.tab-btn{flex:1;padding:8px 4px 6px;text-align:center;font-size:10px;font-weight:600;color:var(--text2);transition:color .15s;}
.tab-btn.active{color:var(--accent);}
.tab-icon{font-size:20px;display:block;margin-bottom:2px;}

.content{flex:1;padding:16px;padding-bottom:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card-subtitle{font-size:12px;color:var(--text2);margin-bottom:8px;}

.day-selector{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 12px;position:sticky;top:49px;z-index:50;background:var(--bg);}
.day-selector button{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);font-size:16px;display:flex;align-items:center;justify-content:center;}
.day-selector button:active{background:var(--accent2);}
.day-label{font-size:14px;font-weight:600;min-width:140px;text-align:center;}

.check-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.check-row:last-child{border:none;}
.check-box{width:28px;height:28px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;transition:all .15s;}
.check-box.done{background:var(--green);border-color:var(--green);}
.check-label{flex:1;font-size:14px;}
.check-detail{font-size:12px;color:var(--text2);}

.rpe-select{display:flex;gap:4px;}
.rpe-btn{width:28px;height:28px;border-radius:6px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.rpe-btn.active{background:var(--accent2);border-color:var(--accent);}

.macro-bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:4px;}
.macro-fill{height:100%;border-radius:4px;transition:width .3s;}
.macro-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;}

.btn{padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;text-align:center;transition:all .15s;}
.btn-primary{background:var(--accent2);color:#fff;}
.btn-primary:active{background:var(--accent);}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);}
.btn-danger{background:#da363340;color:var(--red);border:1px solid #da363380;}
.btn:disabled{opacity:.4;pointer-events:none;}

.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--border);margin:3px;}
.chip.active{background:var(--accent2);border-color:var(--accent);}

.meal-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.meal-item:last-child{border:none;}
.meal-name{font-size:13px;font-weight:600;}
.meal-macros{font-size:11px;color:var(--text2);}
.meal-kcal{font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap;margin-left:8px;}

.lift-table{width:100%;font-size:12px;border-collapse:collapse;}
.lift-table th{text-align:left;font-weight:600;padding:4px;color:var(--text2);border-bottom:1px solid var(--border);}
.lift-table td{padding:4px;}
.lift-table input{width:50px;padding:4px;font-size:12px;text-align:center;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px 16px calc(20px + var(--safe-bottom));-webkit-overflow-scrolling:touch;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}

.chart-container{padding:8px 0;}
.chart-container svg{width:100%;height:auto;}

.perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.perf-card{background:var(--surface2);border-radius:8px;padding:10px;text-align:center;}
.perf-value{font-size:20px;font-weight:700;color:var(--accent);}
.perf-label{font-size:11px;color:var(--text2);margin-top:2px;}

.expandable-header{display:flex;justify-content:space-between;align-items:center;padding:8px 0;cursor:pointer;}
.expandable-arrow{transition:transform .2s;font-size:12px;}
.expandable-arrow.open{transform:rotate(90deg);}

.progress-ring{display:flex;align-items:center;justify-content:center;position:relative;}
.progress-ring-text{position:absolute;font-size:11px;font-weight:700;}

.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.tag-cut{background:#f8514920;color:var(--red);}
.tag-maintain{background:#d2992220;color:var(--orange);}
.tag-lean{background:#3fb95020;color:var(--green);}

.empty-state{text-align:center;padding:32px 16px;color:var(--text2);}
.empty-state .icon{font-size:40px;margin-bottom:12px;}

.supp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.supp-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface2);font-size:13px;cursor:pointer;}
.supp-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;}
.supp-check.done{background:var(--green);border-color:var(--green);}

.note-area{margin-top:8px;}

.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:300;animation:fadeInOut 2s ease;}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-10px);}10%{opacity:1;transform:translateX(-50%) translateY(0);}80%{opacity:1;}100%{opacity:0;}}

.loading-dots::after{content:'...';animation:dots 1.5s steps(4) infinite;}
@keyframes dots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}100%{content:'';}}

.flex-row{display:flex;gap:8px;align-items:center;}
.flex-1{flex:1;}
.mt-8{margin-top:8px;}
.mt-12{margin-top:12px;}
.mb-8{margin-bottom:8px;}
.mb-12{margin-bottom:12px;}
.text-center{text-align:center;}
.text-sm{font-size:12px;}
.text-xs{font-size:11px;}
.text-muted{color:var(--text2);}
.text-accent{color:var(--accent);}
.text-green{color:var(--green);}
.text-red{color:var(--red);}
.text-orange{color:var(--orange);}
.fw-bold{font-weight:700;}
.gap-8{gap:8px;}
.w-full{width:100%;}
</style>
</head>
<body>
<div id="root"></div>
<script id="app-source" type="text/plain">
/* HyroxTrack v3.1 — rebuilt 2026-10-05 */
const { useState, useEffect, useRef, useCallback, useMemo, Fragment } = React;

// ─── Constants ─────────────────────────────────────────────
const STORAGE_KEY = 'hyroxtrack_data_v2';
const VERSION = 3;
const TABS = ['Día','Rendimiento','Progreso','Datos'];
const TAB_ICONS = ['📋','🏋️','📈','⚙️'];

// Schedule: Mon=1..Sun=7; Mon/Wed=funcional, Tue/Thu=fuerza, Fri=hyroxSim
const SCHEDULE = {
  1: 'funcional',   // Lunes
  2: 'fuerza',      // Martes
  3: 'funcional',   // Miércoles
  4: 'fuerza',      // Jueves
  5: 'hyroxSim',    // Viernes
  6: 'rest',        // Sábado
  7: 'rest',        // Domingo
};

const DAY_NAMES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTH_NAMES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

const SUPP_LIST = ['proteina','creatina','multivitaminico','omega3'];

const DEFAULT_PROFILE = { heightCm:174, hrMax:185, sex:'m', surgery:'manga gástrica 2025-05' };

// Routines
const ROUTINE_A = {
  name: 'Fuerza A — Empuje + Pierna',
  exercises: [
    {id:'sentadilla',label:'Sentadilla',sets:4,reps:'6-8'},
    {id:'press_banca',label:'Press Banca',sets:4,reps:'6-8'},
    {id:'press_militar',label:'Press Militar',sets:3,reps:'8-10'},
    {id:'extension_pierna',label:'Extensión de Pierna',sets:3,reps:'10-12'},
    {id:'triceps_polea',label:'Tríceps Polea',sets:3,reps:'10-12'},
    {id:'elevaciones_laterales',label:'Elevaciones Laterales',sets:3,reps:'12-15'},
  ]
};
const ROUTINE_B = {
  name: 'Fuerza B — Jalón + Pierna',
  exercises: [
    {id:'peso_muerto',label:'Peso Muerto Rumano',sets:4,reps:'6-8'},
    {id:'remo_barra',label:'Remo con Barra',sets:4,reps:'6-8'},
    {id:'jalon_polea',label:'Jalón Polea',sets:3,reps:'8-10'},
    {id:'curl_femoral',label:'Curl Femoral',sets:3,reps:'10-12'},
    {id:'curl_biceps',label:'Curl Bíceps',sets:3,reps:'10-12'},
    {id:'face_pull',label:'Face Pull',sets:3,reps:'12-15'},
  ]
};
const ROUTINE_FULL = {
  name: 'Full Body',
  exercises: [
    {id:'sentadilla',label:'Sentadilla',sets:3,reps:'6-8'},
    {id:'press_banca',label:'Press Banca',sets:3,reps:'6-8'},
    {id:'remo_barra',label:'Remo con Barra',sets:3,reps:'8-10'},
    {id:'press_militar',label:'Press Militar',sets:3,reps:'8-10'},
    {id:'peso_muerto',label:'Peso Muerto Rumano',sets:3,reps:'8-10'},
    {id:'curl_biceps',label:'Curl Bíceps',sets:2,reps:'10-12'},
    {id:'triceps_polea',label:'Tríceps Polea',sets:2,reps:'10-12'},
  ]
};

// ─── Utility ───────────────────────────────────────────────
function todayStr(){ return new Date().toISOString().slice(0,10); }
function dateAdd(str,n){ const d=new Date(str+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtDate(str){
  const d=new Date(str+'T12:00:00');
  return `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
}
function isoWeekday(str){ const d=new Date(str+'T12:00:00'); return d.getDay()||7; } // 1=Mon..7=Sun
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function pct(v,t){ return t?Math.round(100*v/t):0; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function getScheduleType(dateStr){
  const wd = isoWeekday(dateStr);
  return SCHEDULE[wd] || 'rest';
}

function getRoutineForDate(dateStr){
  // Count fuerza days from plan start to decide A/B alternation
  // Simple: even fuerza-day = A, odd = B
  const type = getScheduleType(dateStr);
  if(type !== 'fuerza') return null;
  const d = new Date(dateStr+'T12:00:00');
  const ref = new Date('2026-09-22T12:00:00');
  const diffDays = Math.round((d-ref)/(86400000));
  let fuerzaCount = 0;
  for(let i=0; i<=diffDays; i++){
    const dd = dateAdd('2026-09-22',i);
    if(getScheduleType(dd)==='fuerza') fuerzaCount++;
  }
  return fuerzaCount%2===1 ? ROUTINE_A : ROUTINE_B;
}

// ─── Storage ───────────────────────────────────────────────
function safeGet(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object') return null;
    return parsed;
  }catch(e){ return null; }
}

function loadData(){
  const d = safeGet(STORAGE_KEY);
  if(!d) return defaultData();
  // Sanitize
  if(!d.version) d.version = VERSION;
  if(!d.profile || typeof d.profile !== 'object') d.profile = {...DEFAULT_PROFILE};
  if(!d.plan || typeof d.plan !== 'object') d.plan = defaultPlan();
  if(!d.days || typeof d.days !== 'object') d.days = {};
  if(!Array.isArray(d.plan.blocks)) d.plan.blocks = defaultPlan().blocks;
  if(!Array.isArray(d.reviews)) d.reviews = [];
  if(!Array.isArray(d.perf)) d.perf = [];
  // Sanitize each day
  Object.keys(d.days).forEach(k => {
    const day = d.days[k];
    if(!day || typeof day !== 'object'){ d.days[k] = emptyDay(); return; }
    if(!Array.isArray(day.meals)) day.meals = [];
    if(!day.weight || typeof day.weight !== 'object') day.weight = {};
    if(!day.lifts || typeof day.lifts !== 'object') day.lifts = {};
    if(!day.supps || typeof day.supps !== 'object') day.supps = {};
  });
  return d;
}

function saveData(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){}
}

function defaultPlan(){
  return {
    startDate:'2026-09-22',
    maintenanceKcal:2550,
    blocks:[
      {id:'b1',name:'Definición 1',goal:'cut',days:28,kcal:2100,kcalFlex:2500,protein:180,carbs:200,fat:67,note:'Base 2,100 kcal L-J. Días flex (V-S): 2,500 max. Promedio semanal ~2,180.'},
      {id:'b2',name:'Definición 2',goal:'cut',days:28,kcal:2000,kcalFlex:2400,protein:180,carbs:185,fat:65,note:'Ajuste con datos reales. Ritmo meta: 0.30–0.45 kg/semana.'},
      {id:'b3',name:'Definición 3',goal:'cut',days:28,kcal:1950,kcalFlex:2350,protein:175,carbs:178,fat:63,note:'Vigila fuerza y sueño antes de recortar más.'},
      {id:'b4',name:'Descanso metabólico',goal:'maintain',days:14,kcal:2550,kcalFlex:2550,protein:170,carbs:300,fat:78,note:'Navidad y Año Nuevo a mantenimiento. Revierte adaptación metabólica.'},
      {id:'b5',name:'Definición 4',goal:'cut',days:28,kcal:1950,kcalFlex:2350,protein:175,carbs:178,fat:63,note:'Último tramo del corte. Cierra ~73-75 kg.'},
      {id:'b6',name:'Transición',goal:'maintain',days:28,kcal:2550,kcalFlex:2550,protein:170,carbs:299,fat:75,note:'Subida gradual a mantenimiento.'},
      {id:'b7',name:'Masa magra 1',goal:'lean',days:28,kcal:2800,kcalFlex:2800,protein:170,carbs:350,fat:80,note:'Superávit +250 kcal. Meta: 0.15–0.25 kg/semana.'},
      {id:'b8',name:'Masa magra 2',goal:'lean',days:28,kcal:2850,kcalFlex:2850,protein:170,carbs:363,fat:80,note:'Prioridad a progresión de carga en los básicos.'},
      {id:'b9',name:'Masa magra 3',goal:'lean',days:28,kcal:2900,kcalFlex:2900,protein:170,carbs:371,fat:82,note:'Si grasa sube >2 puntos, corta a +150 kcal.'},
      {id:'b10',name:'Masa magra 4',goal:'lean',days:28,kcal:2900,kcalFlex:2900,protein:170,carbs:371,fat:82,note:'Cierre construcción ~14 jun 2027.'},
      {id:'b11',name:'Mini-corte',goal:'cut',days:56,kcal:2450,kcalFlex:2450,protein:180,carbs:271,fat:72,note:'8 semanas para revelar lo construido.'},
      {id:'b12',name:'Específico + pico',goal:'maintain',days:35,kcal:2700,kcalFlex:2700,protein:175,carbs:331,fat:75,note:'Trabajo específico Hyrox. Taper última semana.'},
    ]
  };
}

function emptyDay(){
  return {
    funcionalDone:false,funcionalRpe:null,
    fuerzaDone:false,fuerzaRpe:null,
    hyroxSimDone:false,hyroxSimRpe:null,
    hyroxSimMin:null,
    lifts:{},meals:[],weight:{},supps:{},note:''
  };
}

function defaultData(){
  return {
    version:VERSION,
    apiKey:'',
    profile:{...DEFAULT_PROFILE},
    plan:defaultPlan(),
    days:{},
    reviews:[],
    perf:[]
  };
}

// ─── Block/Phase logic ─────────────────────────────────────
function getCurrentBlock(plan, dateStr){
  if(!plan||!plan.blocks||!plan.startDate) return {block:null,blockIdx:0,dayInBlock:0};
  const start = new Date(plan.startDate+'T12:00:00');
  const cur = new Date(dateStr+'T12:00:00');
  let elapsed = Math.max(0, Math.round((cur-start)/86400000));
  let acc = 0;
  for(let i=0;i<plan.blocks.length;i++){
    const b = plan.blocks[i];
    if(elapsed < acc + b.days) return {block:b, blockIdx:i, dayInBlock:elapsed-acc+1};
    acc += b.days;
  }
  const last = plan.blocks[plan.blocks.length-1];
  return {block:last, blockIdx:plan.blocks.length-1, dayInBlock:last.days};
}

function isFlexDay(dateStr){
  const wd = isoWeekday(dateStr);
  return wd >= 5; // Fri, Sat, Sun = flex days
}

function getTargetKcal(block, dateStr){
  if(!block) return 2100;
  return isFlexDay(dateStr) ? (block.kcalFlex || block.kcal) : block.kcal;
}

// ─── API helpers ───────────────────────────────────────────
async function callClaude(apiKey, messages, maxTokens=1024){
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:maxTokens,
      messages
    })
  });
  if(!res.ok) throw new Error(`API ${res.status}`);
  const data = await res.json();
  return data.content?.[0]?.text || '';
}

async function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ─── Error Boundary ────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return {error:e};}
  render(){
    if(this.state.error) return React.createElement('div',{className:'card',style:{textAlign:'center',padding:32}},
      React.createElement('div',{style:{fontSize:32,marginBottom:8}},'⚠️'),
      React.createElement('div',{className:'text-muted'},'Error en ' + (this.props.name||'componente')),
      React.createElement('div',{className:'text-xs text-muted',style:{marginTop:4}},String(this.state.error.message||'')),
      React.createElement('button',{className:'btn btn-secondary mt-12',onClick:()=>this.setState({error:null})},'Reintentar')
    );
    return this.props.children;
  }
}

// ─── Small Components ──────────────────────────────────────
function Toast({msg}){
  if(!msg) return null;
  return React.createElement('div',{className:'toast'},msg);
}

function RpeSelect({value,onChange}){
  return React.createElement('div',{className:'rpe-select'},
    [5,6,7,8,9,10].map(n=>
      React.createElement('button',{key:n,className:'rpe-btn'+(value===n?' active':''),onClick:()=>onChange(n)},n)
    )
  );
}

function MacroBar({current,target,color}){
  const p = clamp(pct(current,target),0,150);
  const barColor = p>110 ? 'var(--red)' : p>90 ? color : color;
  return React.createElement('div',{className:'macro-bar'},
    React.createElement('div',{className:'macro-fill',style:{width:Math.min(p,100)+'%',background:barColor}})
  );
}

function ProgressRing({pct:p,size,stroke,color}){
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const off = c - (clamp(p,0,100)/100)*c;
  return React.createElement('div',{className:'progress-ring',style:{width:size,height:size}},
    React.createElement('svg',{width:size,height:size},
      React.createElement('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:'var(--surface2)',strokeWidth:stroke}),
      React.createElement('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:color,strokeWidth:stroke,strokeDasharray:c,strokeDashoffset:off,strokeLinecap:'round',transform:`rotate(-90 ${size/2} ${size/2})`})
    ),

// ─── Expandable Routine / Lifts ────────────────────────────
function ExpandableRoutine({routine,lifts,onUpdateLifts}){
  const [open,setOpen] = useState(true);
  if(!routine) return null;

  function updateSet(exId,setIdx,field,val){
    const cur = {...lifts};
    if(!cur[exId]) cur[exId] = routine.exercises.find(e=>e.id===exId)
      ? Array.from({length:routine.exercises.find(e=>e.id===exId).sets},()=>({w:0,r:0,rir:2}))
      : [];
    cur[exId] = [...cur[exId]];
    cur[exId][setIdx] = {...cur[exId][setIdx],[field]:Number(val)||0};
    onUpdateLifts(cur);
  }

  function copyPrevSet(exId,setIdx){
    if(setIdx===0) return;
    const cur = {...lifts};
    if(!cur[exId]) return;
    cur[exId] = [...cur[exId]];
    cur[exId][setIdx] = {...cur[exId][setIdx-1]};
    onUpdateLifts(cur);
  }

  return React.createElement('div',{className:'card'},
    React.createElement('div',{className:'expandable-header',onClick:()=>setOpen(!open)},
      React.createElement('div',{className:'card-title',style:{margin:0}},'🏋️ ',routine.name),
      React.createElement('span',{className:'expandable-arrow'+(open?' open':'')},'▶')
    ),
    open && routine.exercises.map(ex=>{
      const sets = lifts[ex.id] || Array.from({length:ex.sets},()=>({w:0,r:0,rir:2}));
      return React.createElement('div',{key:ex.id,style:{marginTop:12}},
        React.createElement('div',{className:'text-sm fw-bold mb-8'},ex.label,' ',
          React.createElement('span',{className:'text-muted'},ex.sets+'×'+ex.reps)
        ),
        React.createElement('table',{className:'lift-table'},
          React.createElement('thead',null,
            React.createElement('tr',null,
              React.createElement('th',null,'Set'),
              React.createElement('th',null,'Kg'),
              React.createElement('th',null,'Reps'),
              React.createElement('th',null,'RIR'),
              React.createElement('th',null,'')
            )
          ),
          React.createElement('tbody',null,
            sets.map((s,i)=>
              React.createElement('tr',{key:i},
                React.createElement('td',null,i+1),
                React.createElement('td',null,React.createElement('input',{type:'number',value:s.w||'',onChange:e=>updateSet(ex.id,i,'w',e.target.value)})),
                React.createElement('td',null,React.createElement('input',{type:'number',value:s.r||'',onChange:e=>updateSet(ex.id,i,'r',e.target.value)})),
                React.createElement('td',null,React.createElement('input',{type:'number',value:s.rir===0?'0':s.rir||'',onChange:e=>updateSet(ex.id,i,'rir',e.target.value)})),
                React.createElement('td',null,i>0&&React.createElement('button',{className:'text-xs text-accent',onClick:()=>copyPrevSet(ex.id,i)},'⬆'))
              )
            )
          )
        )
      );
    })
  );
}

  const day = data.days[date] || emptyDay();
  const type = getScheduleType(date);

  function updateDay(patch){
    const newDay = {...day,...patch};
    const newDays = {...data.days,[date]:newDay};
    const newData = {...data,days:newDays};
    setData(newData);
    saveData(newData);
  }

  function updateLifts(lifts){
    updateDay({lifts});

  function updateMeals(meals){
    updateDay({meals});
  }

  return React.createElement(Fragment,null,
    React.createElement(DaySelector,{date,onChange:setDate}),

function SimpleChart({data:chartData,width,height,color,label,unit,yMin,yMax}){
  if(!chartData||!chartData.length) return React.createElement('div',{className:'empty-state text-sm'},'Sin datos para graficar');

  const vals = chartData.map(d=>d.v);
  const mn = yMin!==undefined?yMin:Math.min(...vals);
  const mx = yMax!==undefined?yMax:Math.max(...vals);
  const range = mx-mn || 1;
  const pad = 40;
  const w = width-pad*2;
  const h = height-pad*2;

  const pts = chartData.map((d,i)=>({
    x: pad + (chartData.length>1 ? i/(chartData.length-1)*w : w/2),
    y: pad + h - ((d.v-mn)/range)*h
  }));

  const path = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');

  // Y axis labels
  const yLabels = [mn,mn+range/2,mx].map(v=>({v:v.toFixed(1),y:pad+h-((v-mn)/range)*h}));
  // X axis labels (first, mid, last)
  const xIdxs = chartData.length<=5 ? chartData.map((_,i)=>i) : [0,Math.floor(chartData.length/2),chartData.length-1];

  return React.createElement('div',{className:'chart-container'},
    React.createElement('div',{className:'text-xs text-muted mb-8'},label),
    React.createElement('svg',{viewBox:`0 0 ${width} ${height}`,preserveAspectRatio:'xMidYMid meet'},
      // Grid
      yLabels.map((yl,i)=>
        React.createElement('line',{key:'g'+i,x1:pad,x2:width-pad,y1:yl.y,y2:yl.y,stroke:'var(--border)',strokeWidth:0.5})
      ),
      // Y labels
      yLabels.map((yl,i)=>
        React.createElement('text',{key:'y'+i,x:pad-4,y:yl.y+4,fill:'var(--text2)',fontSize:9,textAnchor:'end'},yl.v)
      ),
      // X labels
      xIdxs.map(idx=>
        React.createElement('text',{key:'x'+idx,x:pts[idx].x,y:height-4,fill:'var(--text2)',fontSize:8,textAnchor:'middle'},
          chartData[idx].label
        )
      ),
      // Line
      React.createElement('path',{d:path,fill:'none',stroke:color,strokeWidth:2,strokeLinejoin:'round'}),
      // Dots
      pts.map((p,i)=>
        React.createElement('circle',{key:i,cx:p.x,cy:p.y,r:3,fill:color})
      ),
      // Unit
      React.createElement('text',{x:4,y:12,fill:'var(--text2)',fontSize:8},unit||'')
    )
  );
}

function WeeklyAdherence({data}){
  // Last 4 weeks
  const today = todayStr();
  const weeks = [];
  for(let w=0;w<4;w++){
    const weekStart = dateAdd(today, -((isoWeekday(today)-1) + w*7));
    let planned=0, done=0;
    for(let d=0;d<7;d++){
      const dd = dateAdd(weekStart,d);
      const type = getScheduleType(dd);
      if(type==='rest') continue;
      planned++;
      const day = data.days[dd];
      if(!day) continue;
      if(type==='funcional'&&day.funcionalDone) done++;
      if(type==='fuerza'&&day.fuerzaDone) done++;
      if(type==='hyroxSim'&&day.hyroxSimDone) done++;
    }
    weeks.unshift({label:'S'+(w===0?'actual':'-'+w),planned,done});
  }

  return React.createElement('div',{className:'card'},
    React.createElement('div',{className:'card-title'},'📊 Adherencia semanal'),
    React.createElement('div',{style:{display:'flex',justifyContent:'space-around'}},
      weeks.map((w,i)=>
        React.createElement('div',{key:i,style:{textAlign:'center'}},
          React.createElement(ProgressRing,{pct:w.planned?pct(w.done,w.planned):0,size:50,stroke:4,color:pct(w.done,w.planned)>=80?'var(--green)':'var(--orange)'}),
          React.createElement('div',{className:'text-xs text-muted',style:{marginTop:4}},w.label),
          React.createElement('div',{className:'text-xs'},w.done,'/',w.planned)
        )
      )
    )
  );
}

    setData(newData);
    saveData(newData);
  }

  function updateApiKey(key){
    const newData = {...data,apiKey:key};
    setData(newData);
    saveData(newData);
  }

  function updateBlock(idx,patch){
    const blocks = [...data.plan.blocks];
    blocks[idx] = {...blocks[idx],...patch};
    const newData = {...data,plan:{...data.plan,blocks}};
    setData(newData);
    saveData(newData);
  }

  // Review: apply changes to next block
  function applyReview(){
    const {block,blockIdx,dayInBlock} = getCurrentBlock(data.plan, todayStr());
    if(!block) return;

    // Check if review already exists for this block
    const existingReview = (data.reviews||[]).find(r=>r.blockId===block.id);
    if(existingReview){
      alert('Ya existe una revisión para este bloque.');
      return;
    }

    // Collect stats for current block
    const start = data.plan.startDate;
    let blockStart = start;
    for(let i=0;i<blockIdx;i++){
      blockStart = dateAdd(blockStart, data.plan.blocks[i].days);
    }

    const dayKeys = Object.keys(data.days).filter(d=>d>=blockStart && d<=todayStr()).sort();
    const daysWithMeals = dayKeys.filter(d=>(data.days[d]?.meals||[]).length>0);

    const weights = dayKeys.filter(d=>data.days[d]?.weight?.kg).map(d=>data.days[d].weight.kg);
    const avgWeight = weights.length ? (weights.reduce((a,b)=>a+b,0)/weights.length).toFixed(1) : null;
    const weightDelta = weights.length>=2 ? (weights[weights.length-1]-weights[0]).toFixed(1) : null;

    const review = {

      blockIdx,
      date:todayStr(),
      avgKcal,
      avgWeight,
      weightDelta,
      daysLogged:daysWithMeals.length,
      totalDays:dayKeys.length

    const newReviews = [...(data.reviews||[]),review];

function App(){
  const [data,setData] = useState(()=>loadData());
  const [tab,setTab] = useState(0);
  const [date,setDate] = useState(todayStr());
  const [toast,setToast] = useState('');
  const fileRef = useRef();

  function showToast(msg){
    setToast(msg);
    setTimeout(()=>setToast(''),2500);
  }

  function doBackup(){
    const json = JSON.stringify(data,null,2);
    const blob = new Blob([json],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='hyroxtrack-'+todayStr()+'.json'; a.click();
    URL.revokeObjectURL(url);
    showToast('Backup descargado');
  }

  function doRestore(){
    fileRef.current?.click();
  }

  function handleRestore(e){
    const file = e.target.files?.[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const imported = JSON.parse(reader.result);
        if(!imported||typeof imported!=='object') throw new Error('invalid');
        // Migrate: add kcalFlex if missing
        if(imported.plan?.blocks){
          imported.plan.blocks = imported.plan.blocks.map(b=>({
            ...b,
            kcalFlex: b.kcalFlex || b.kcal
          }));
        }
        // Migrate: add hyroxSim fields to days
        if(imported.days){
          Object.keys(imported.days).forEach(k=>{
            const d = imported.days[k];
            if(d.hyroxSimDone===undefined) d.hyroxSimDone = false;
            if(d.hyroxSimRpe===undefined) d.hyroxSimRpe = null;
            if(d.hyroxSimMin===undefined) d.hyroxSimMin = null;
          });
        }
        // Fix reviews duplication bug: deduplicate
        if(Array.isArray(imported.reviews)){
          const seen = new Set();
          imported.reviews = imported.reviews.filter(r=>{
            const key = JSON.stringify(r);
            if(seen.has(key)) return false;
            seen.add(key);
            return true;
          });
        }
        setData(imported);
        saveData(imported);
        showToast('Datos restaurados ✓');
      }catch(err){
        alert('Error al restaurar: '+err.message);
      }
    };
    reader.readAsText(file);
    if(fileRef.current) fileRef.current.value='';
  }

  const {block,blockIdx,dayInBlock} = getCurrentBlock(data.plan, date);

  return React.createElement('div',{className:'app'},
    React.createElement(Toast,{msg:toast}),
    React.createElement('input',{ref:fileRef,type:'file',accept:'.json',style:{display:'none'},onChange:handleRestore}),
    React.createElement(TopBar,{block,blockIdx,dayInBlock,onBackup:doBackup,onRestore:doRestore}),
    React.createElement('div',{className:'content'},
      tab===0 && React.createElement(ErrorBoundary,{name:'TabDia'},React.createElement(TabDia,{data,setData,date,setDate})),
      tab===1 && React.createElement(ErrorBoundary,{name:'TabRendimiento'},React.createElement(TabRendimiento,{data,setData})),
      tab===2 && React.createElement(ErrorBoundary,{name:'TabProgreso'},React.createElement(TabProgreso,{data})),
      tab===3 && React.createElement(ErrorBoundary,{name:'TabDatos'},React.createElement(TabDatos,{data,setData}))
    ),
    React.createElement(Tabbar,{active:tab,onChange:setTab})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

</script>
