<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-title" content="HyroxTrack" />
<meta name="theme-color" content="#0E1013" />
<title>HyroxTrack — Acapulco 6 sep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230E1013'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23FF4B3E' font-family='Arial' font-weight='900'%3EH%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1013;
    --bg2:#15181D;
    --card:#1B1F26;
    --card-border:#262B33;
    --line:#2A2F38;
    --text:#F2F3F5;
    --text-dim:#9AA1AC;
    --text-faint:#5C636E;
    --coral:#FF4B3E;
    --coral-dim:#7A2A24;
    --teal:#2DD4BF;
    --amber:#F2B134;
    --blue:#4C8EFF;
    --green:#4CAF7D;
    --danger:#FF4B3E;
    --radius:16px;
    --radius-sm:10px;
    --font-display:'Barlow Condensed',system-ui,-apple-system,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.45;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:0.2px;}
  .app-shell{max-width:560px;margin:0 auto;padding:14px 14px 4px;}
  /* ---------- Header ---------- */
  .topbar{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 14px;}
  .topbar .brand{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:0.5px;}
  .topbar .brand span{color:var(--coral);}
  .topbar .countdown{font-size:12px;color:var(--text-dim);text-align:right;line-height:1.3;}
  .topbar .countdown b{color:var(--teal);font-size:15px;display:block;font-family:var(--font-display);}
  /* ---------- Banner ---------- */
  .banner{background:linear-gradient(90deg,#3A2A16,#2A1F14);border:1px solid #5C431E;color:#F2C879;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:center;}
  .banner.err{background:linear-gradient(90deg,#3A1616,#2A1414);border-color:#5C1E1E;color:#F29A9A;}
  .banner button{margin-left:auto;background:rgba(255,255,255,0.08);border:none;color:inherit;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;}
  /* ---------- Cards ---------- */
  .card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .card-title h3{font-size:19px;}
  .card-sub{color:var(--text-dim);font-size:12.5px;margin-top:-6px;margin-bottom:10px;}
  .pill{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--text-dim);font-weight:600;}
  .pill.on{background:rgba(76,175,125,0.15);border-color:rgba(76,175,125,0.4);color:var(--green);}
  .pill.phase{background:rgba(255,75,62,0.12);border-color:rgba(255,75,62,0.35);color:#FF8177;}
  /* ---------- Day selector ---------- */
  .day-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px;scrollbar-width:none;}
  .day-scroll::-webkit-scrollbar{display:none;}
  .day-chip{flex:0 0 auto;width:52px;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-display);color:var(--text-dim);cursor:pointer;position:relative;}
  .day-chip .dnum{font-size:20px;font-weight:800;color:var(--text);}
  .day-chip .dlabel{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;}
  .day-chip.today{border-color:var(--teal);}
  .day-chip.selected{background:var(--coral);border-color:var(--coral);}
  .day-chip.selected .dnum,.day-chip.selected .dlabel{color:#fff;}
  .day-chip .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--green);}
  /* ---------- Checklist ---------- */
  .check-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .check-row:last-child{border-bottom:none;}
  .check-box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;font-weight:800;}
  .check-box.checked{background:var(--green);border-color:var(--green);color:#08130D;}
  .check-label{flex:1;font-weight:600;font-size:14.5px;}
  .check-meta{font-size:11.5px;color:var(--text-dim);font-weight:500;}
  .rpe-select{display:flex;gap:4px;}
  .rpe-dot{width:22px;height:22px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);font-size:10.5px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-weight:700;}
  .rpe-dot.active{background:var(--amber);border-color:var(--amber);color:#1a1300;}
  .expand-toggle{background:none;border:none;color:var(--teal);font-size:12.5px;font-weight:600;padding:4px 2px 8px;display:block;}
  .routine-box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:2px 0 10px;font-size:13px;color:var(--text-dim);}
  .routine-box b{color:var(--text);}
  .routine-ex{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);}
  .routine-ex:last-child{border-bottom:none;}
  /* ---------- Macro bars ---------- */
  .macro-bar-wrap{margin-bottom:8px;}
  .macro-bar-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);margin-bottom:3px;font-weight:600;}
  .macro-bar-track{height:9px;border-radius:5px;background:var(--bg2);overflow:hidden;border:1px solid var(--line);}
  .macro-bar-fill{height:100%;border-radius:5px;transition:width 0.3s ease;}
  .kcal-summary{display:flex;align-items:baseline;gap:6px;margin-bottom:12px;}
  .kcal-summary .big{font-family:var(--font-display);font-size:34px;font-weight:800;}
  .kcal-summary .of{color:var(--text-dim);font-size:14px;}
  /* ---------- Food list / chips ---------- */
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
  .food-chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--text);}
  .food-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .food-item:last-child{border-bottom:none;}
  .food-item .fi-name{font-weight:600;}
  .food-item .fi-macro{color:var(--text-dim);font-size:11.5px;}
  .food-item .fi-del{background:none;border:none;color:var(--text-faint);font-size:18px;padding:0 4px;}
  /* ---------- Buttons / inputs ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-weight:600;font-size:13.5px;padding:11px 14px;cursor:pointer;width:100%;}
  .btn-primary{background:var(--coral);border-color:var(--coral);color:#fff;}
  .btn-secondary{background:rgba(45,212,191,0.12);border-color:rgba(45,212,191,0.4);color:var(--teal);}
  .btn-danger{background:rgba(255,75,62,0.12);border-color:rgba(255,75,62,0.4);color:#FF8177;}
  .btn-ghost{background:transparent;}
  .btn-row{display:flex;gap:8px;}
  .btn-row .btn{flex:1;}
  .btn:active{transform:scale(0.98);}
  .btn[disabled]{opacity:0.5;}
  input[type=text],input[type=number],input[type=password],textarea,select{
    width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--text);
    padding:10px 12px;font-size:14px;font-family:var(--font-body);
  }
  textarea{resize:vertical;min-height:60px;}
  label.field-label{display:block;font-size:11.5px;color:var(--text-dim);font-weight:600;margin:8px 0 4px;text-transform:uppercase;letter-spacing:0.4px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .file-btn{position:relative;overflow:hidden;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  /* ---------- Tabs ---------- */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(21,24,29,0.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50;}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text-faint);font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:10px;}
  .tab-btn .ic{font-size:19px;}
  .tab-btn.active{color:var(--coral);}
  /* ---------- Stats ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:4px;}
  .stat-box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;}
  .stat-box .sv{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--teal);}
  .stat-box .sl{font-size:10.5px;color:var(--text-dim);font-weight:600;margin-top:2px;}
  /* ---------- Section headers ---------- */
  .section-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);font-weight:700;margin:18px 2px 8px;}
  .section-eyebrow:first-child{margin-top:0;}
  /* ---------- Misc ---------- */
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .muted{color:var(--text-dim);}
  .small{font-size:12px;}
  .divider{height:1px;background:var(--line);margin:12px 0;}
  .empty-state{text-align:center;padding:26px 10px;color:var(--text-dim);font-size:13px;}
  .empty-state .ic{font-size:30px;display:block;margin-bottom:8px;}
  .err-fallback{padding:40px 20px;text-align:center;}
  .err-fallback h2{color:var(--coral);margin-bottom:10px;}
  .loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}
  .history-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .history-item:last-child{border-bottom:none;}
  .history-item .hi-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;}
  .history-item .hi-meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .seg-row{display:flex;gap:6px;margin-bottom:6px;}
  .seg-row input{flex:1;}
  .link-btn{background:none;border:none;color:var(--teal);font-size:12.5px;font-weight:600;padding:4px 0;}
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

<script type="text/plain" id="app-source">
/* HyroxTrack — app.jsx
   Reconstruido completo: Babel runtime classic explícito, Error Boundaries por pestaña,
   lectura de localStorage a prueba de datos legacy/corruptos. */

const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =========================================================
   CONSTANTES / CONFIG
   ========================================================= */
const START_DATE = "2026-07-28";
const TOTAL_DAYS = 41;
const STORAGE_KEY = "hyroxtrack_data_v2";
const APP_VERSION = 2;
const CLAUDE_MODEL = "claude-sonnet-5";
const ANTHROPIC_URL = "https://api.anthropic.com/v1/messages";

const COLOR = { coral: "#FF4B3E", teal: "#2DD4BF", amber: "#F2B134", blue: "#4C8EFF", green: "#4CAF7D", faint: "#5C636E" };

const WEEKDAY_NAMES = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
const WEEKDAY_NAMES_FULL = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

function clip(n, lo, hi) { return Math.min(Math.max(n, lo), hi); }

function dateForDay(dayNum) {
  const d = new Date(START_DATE + "T00:00:00");
  d.setDate(d.getDate() + (dayNum - 1));
  return d;
}
function fmtDateShort(d) { return d.getDate() + " " + MONTHS[d.getMonth()]; }
function todayDayNumber() {
  const start = new Date(START_DATE + "T00:00:00");
  const now = new Date();
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((nowMid - startMid) / 86400000) + 1;
}

/* =========================================================
   PLAN / FASES
   ========================================================= */
const DEFAULT_PHASES = [
  { id: 1, name: "Déficit", startDay: 1, endDay: 28, kcal: 2200, protein: 180, carbs: 180, fat: 84 },
  { id: 2, name: "Mantenimiento", startDay: 29, endDay: 36, kcal: 2490, protein: 180, carbs: 230, fat: 95 },
  { id: 3, name: "Carga de carbos", startDay: 37, endDay: 40, kcal: 3000, protein: 170, carbs: 380, fat: 89 },
  { id: 4, name: "Día de carrera", startDay: 41, endDay: 41, kcal: 3100, protein: 160, carbs: 400, fat: 85 },
];

function getPhase(phases, dayNum) {
  const list = phases && phases.length ? phases : DEFAULT_PHASES;
  for (const p of list) { if (dayNum >= p.startDay && dayNum <= p.endDay) return p; }
  return list[list.length - 1];
}

function weekdayOf(dayNum) { return dateForDay(dayNum).getDay(); }

function scheduleForDay(dayNum, phases) {
  const phase = getPhase(phases, dayNum);
  const wd = weekdayOf(dayNum);
  const sched = { hyrox: false, pesas: null, correr: null };
  if (phase.id === 4) {
    sched.hyrox = true; // día de carrera: siempre, sin importar el día de la semana
  } else if (wd !== 6) {
    sched.hyrox = true; // todos los días excepto sábado
  }
  if (phase.id === 1) {
    if (wd === 1) sched.pesas = "A";
    if (wd === 3) sched.pesas = "B";
    if (wd === 2 || wd === 4) sched.correr = runDurationPhase1(dayNum, phases);
  } else if (phase.id === 2) {
    if (wd === 1) sched.pesas = "FULL";
    if (wd === 2 || wd === 4) sched.correr = 11;
  }
  return sched;
}

function runDurationPhase1(dayNum, phases) {
  const list = phases && phases.length ? phases : DEFAULT_PHASES;
  const phase1 = list.find((p) => p.id === 1) || DEFAULT_PHASES[0];
  const sessions = [];
  for (let d = phase1.startDay; d <= phase1.endDay; d++) {
    const wd = weekdayOf(d);
    if (wd === 2 || wd === 4) sessions.push(d);
  }
  const idx = sessions.indexOf(dayNum);
  if (idx === -1) return 12;
  const n = sessions.length;
  if (n <= 1) return 12;
  return Math.round(12 + (22 - 12) * (idx / (n - 1)));
}

/* =========================================================
   RUTINAS
   ========================================================= */
const ROUTINE_A = {
  title: "Día A — Empuje + Core",
  exercises: [
    { name: "Press banca", sets: "4x8-10" },
    { name: "Press militar", sets: "3x8-10" },
    { name: "Fondos / press inclinado", sets: "3x10-12" },
    { name: "Elevaciones laterales", sets: "3x12-15" },
    { name: "Extensión de tríceps", sets: "3x12-15" },
    { name: "Plancha", sets: "3x40-60s" },
  ],
};
const ROUTINE_B = {
  title: "Día B — Tracción + Piernas ligero",
  exercises: [
    { name: "Peso muerto rumano", sets: "4x8-10" },
    { name: "Remo (barra/mancuerna)", sets: "3x10-12" },
    { name: "Dominadas / jalón", sets: "3x8-10" },
    { name: "Curl de bíceps", sets: "3x12-15" },
    { name: "Face pull", sets: "3x15" },
    { name: "Zancadas / goblet squat", sets: "3x12/pierna" },
  ],
};
const ROUTINE_FULL = {
  title: "Full body — Mantenimiento",
  exercises: [
    { name: "Press banca", sets: "3x8-10" },
    { name: "Remo (barra/mancuerna)", sets: "3x10-12" },
    { name: "Zancadas / goblet squat", sets: "3x12/pierna" },
    { name: "Plancha", sets: "3x40-60s" },
  ],
};
function runProtocolText(min) {
  return "Calentamiento: 5 min caminata + trote suave. Ritmo: " + min + " min en Zona 2, ritmo conversacional (debes poder hablar en frases completas). Enfriamiento: 5 min caminata.";
}

/* =========================================================
   ALMACENAMIENTO — lectura a prueba de datos legacy/corruptos
   ========================================================= */
function emptyDay() {
  return { hyroxDone: false, hyroxRpe: null, pesasDone: false, pesasRpe: null, correrDone: false, correrRpe: null, weight: null, meals: [] };
}
function emptyData() {
  return {
    version: APP_VERSION,
    apiKey: "",
    days: {},
    performance: { hyrox: [], secondary: [] },
    frequentFoods: [
      { id: "ff1", name: "Pechuga de pollo 150g", kcal: 248, protein: 46, carbs: 0, fat: 5 },
      { id: "ff2", name: "Claras de huevo (4)", kcal: 68, protein: 14, carbs: 1, fat: 0 },
      { id: "ff3", name: "Arroz cocido 1 taza", kcal: 205, protein: 4, carbs: 45, fat: 0 },
      { id: "ff4", name: "Whey scoop", kcal: 120, protein: 24, carbs: 3, fat: 1 },
    ],
    plan: { phases: DEFAULT_PHASES.map((p) => ({ ...p })) },
    lastExportAt: null,
  };
}

function sanitizeDay(raw) {
  const d = emptyDay();
  if (!raw || typeof raw !== "object") return d;
  d.hyroxDone = !!raw.hyroxDone;
  d.hyroxRpe = Number.isFinite(raw.hyroxRpe) ? raw.hyroxRpe : null;
  d.pesasDone = !!raw.pesasDone;
  d.pesasRpe = Number.isFinite(raw.pesasRpe) ? raw.pesasRpe : null;
  d.correrDone = !!raw.correrDone;
  d.correrRpe = Number.isFinite(raw.correrRpe) ? raw.correrRpe : null;
  if (raw.weight && typeof raw.weight === "object" && Number.isFinite(raw.weight.kg)) {
    d.weight = {
      kg: raw.weight.kg,
      bodyFatPct: Number.isFinite(raw.weight.bodyFatPct) ? raw.weight.bodyFatPct : null,
      musclePct: Number.isFinite(raw.weight.musclePct) ? raw.weight.musclePct : null,
      visceral: Number.isFinite(raw.weight.visceral) ? raw.weight.visceral : null,
      waterPct: Number.isFinite(raw.weight.waterPct) ? raw.weight.waterPct : null,
      time: typeof raw.weight.time === "string" ? raw.weight.time : "",
    };
  }
  if (Array.isArray(raw.meals)) {
    d.meals = raw.meals
      .filter((m) => m && typeof m === "object" && Number.isFinite(m.kcal))
      .map((m) => ({
        id: m.id || "m" + Math.random().toString(36).slice(2),
        name: typeof m.name === "string" ? m.name : "Comida",
        kcal: m.kcal,
        protein: Number.isFinite(m.protein) ? m.protein : 0,
        carbs: Number.isFinite(m.carbs) ? m.carbs : 0,
        fat: Number.isFinite(m.fat) ? m.fat : 0,
        time: typeof m.time === "string" ? m.time : "",
        source: typeof m.source === "string" ? m.source : "manual",
      }));
  }
  return d;
}

function sanitizePerfEntry(raw, kind) {
  if (!raw || typeof raw !== "object") return null;
  if (!Number.isFinite(raw.durationMin) && !Number.isFinite(raw.dayNumber)) return null;
  return {
    id: raw.id || "p" + Math.random().toString(36).slice(2),
    date: typeof raw.date === "string" ? raw.date : "",
    dayNumber: Number.isFinite(raw.dayNumber) ? raw.dayNumber : null,
    type: kind === "secondary" ? (raw.type === "pesas" ? "pesas" : "running") : "hyrox",
    durationMin: Number.isFinite(raw.durationMin) ? raw.durationMin : null,
    hrAvg: Number.isFinite(raw.hrAvg) ? raw.hrAvg : null,
    hrMax: Number.isFinite(raw.hrMax) ? raw.hrMax : null,
    rpe: Number.isFinite(raw.rpe) ? raw.rpe : null,
    segments: Array.isArray(raw.segments)
      ? raw.segments.filter((s) => s && typeof s === "object").map((s) => ({ label: String(s.label || ""), value: String(s.value || "") }))
      : [],
    notes: typeof raw.notes === "string" ? raw.notes : "",
  };
}

function migratePerformance(raw) {
  const out = { hyrox: [], secondary: [] };
  if (!raw) return out;
  if (Array.isArray(raw)) {
    raw.forEach((entry) => {
      const kind = entry && (entry.category === "hyrox" || entry.kind === "hyrox" || entry.type === "hyrox") ? "hyrox" : "secondary";
      const s = sanitizePerfEntry(entry, kind);
      if (s) out[kind].push(s);
    });
    return out;
  }
  if (typeof raw === "object") {
    if (Array.isArray(raw.hyrox)) raw.hyrox.forEach((e) => { const s = sanitizePerfEntry(e, "hyrox"); if (s) out.hyrox.push(s); });
    if (Array.isArray(raw.secondary)) raw.secondary.forEach((e) => { const s = sanitizePerfEntry(e, "secondary"); if (s) out.secondary.push(s); });
    if (Array.isArray(raw.running)) raw.running.forEach((e) => { const s = sanitizePerfEntry({ ...e, type: "running" }, "secondary"); if (s) out.secondary.push(s); });
    if (Array.isArray(raw.pesas)) raw.pesas.forEach((e) => { const s = sanitizePerfEntry({ ...e, type: "pesas" }, "secondary"); if (s) out.secondary.push(s); });
  }
  return out;
}

function sanitizeData(raw) {
  const base = emptyData();
  if (!raw || typeof raw !== "object") return base;
  base.apiKey = typeof raw.apiKey === "string" ? raw.apiKey : "";
  base.lastExportAt = typeof raw.lastExportAt === "string" ? raw.lastExportAt : null;
  if (raw.days && typeof raw.days === "object" && !Array.isArray(raw.days)) {
    Object.keys(raw.days).forEach((k) => { if (/^\d+$/.test(k)) base.days[k] = sanitizeDay(raw.days[k]); });
  }
  base.performance = migratePerformance(raw.performance);
  if (Array.isArray(raw.frequentFoods)) {
    const ff = raw.frequentFoods
      .filter((f) => f && typeof f === "object" && typeof f.name === "string" && Number.isFinite(f.kcal))
      .map((f) => ({ id: f.id || "ff" + Math.random().toString(36).slice(2), name: f.name, kcal: f.kcal, protein: Number.isFinite(f.protein) ? f.protein : 0, carbs: Number.isFinite(f.carbs) ? f.carbs : 0, fat: Number.isFinite(f.fat) ? f.fat : 0 }));
    if (ff.length) base.frequentFoods = ff;
  }
  if (raw.plan && Array.isArray(raw.plan.phases) && raw.plan.phases.length) {
    const phases = raw.plan.phases
      .filter((p) => p && Number.isFinite(p.startDay) && Number.isFinite(p.endDay) && Number.isFinite(p.kcal))
      .map((p, i) => ({
        id: Number.isFinite(p.id) ? p.id : i + 1,
        name: typeof p.name === "string" ? p.name : "Fase " + (i + 1),
        startDay: p.startDay, endDay: p.endDay, kcal: p.kcal,
        protein: Number.isFinite(p.protein) ? p.protein : 0,
        carbs: Number.isFinite(p.carbs) ? p.carbs : 0,
        fat: Number.isFinite(p.fat) ? p.fat : 0,
      }));
    if (phases.length) base.plan.phases = phases;
  }
  return base;
}

/* =========================================================
   IA — llamadas directas a la API pública de Anthropic
   ========================================================= */
async function callClaude(apiKey, content, maxTokens) {
  const resp = await fetch(ANTHROPIC_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: CLAUDE_MODEL, max_tokens: maxTokens || 1024, messages: [{ role: "user", content }] }),
  });
  if (!resp.ok) {
    let detail = "";
    try { const j = await resp.json(); detail = (j && j.error && j.error.message) || JSON.stringify(j); } catch (e) {}
    throw new Error("API " + resp.status + (detail ? ": " + detail : ""));
  }
  const data = await resp.json();
  const textBlock = (data.content || []).find((b) => b.type === "text");
  if (!textBlock) throw new Error("La IA no devolvió texto");
  return textBlock.text;
}
function extractJson(text) {
  let t = (text || "").trim();
  t = t.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
  const start = t.indexOf("{"); const end = t.lastIndexOf("}");
  if (start !== -1 && end !== -1) t = t.slice(start, end + 1);
  return JSON.parse(t);
}
async function aiParseMealText(apiKey, text) {
  const prompt = 'Eres un nutriólogo. Analiza esta comida descrita en texto y estima sus macros totales. Responde UNICAMENTE con JSON valido, sin texto adicional ni markdown, con este formato exacto: {"name":"nombre corto","kcal":numero,"protein":numero,"carbs":numero,"fat":numero}. Comida: ' + text;
  const raw = await callClaude(apiKey, prompt, 400);
  return extractJson(raw);
}
async function aiParseMealPhoto(apiKey, base64, mediaType) {
  const prompt = 'Eres un nutriologo. Observa esta foto de un platillo y estima sus macros totales de la porcion visible. Responde UNICAMENTE con JSON valido, sin texto adicional, con este formato exacto: {"name":"nombre corto","kcal":numero,"protein":numero,"carbs":numero,"fat":numero}.';
  const raw = await callClaude(apiKey, [{ type: "image", source: { type: "base64", media_type: mediaType, data: base64 } }, { type: "text", text: prompt }], 400);
  return extractJson(raw);
}
async function aiParseScalePhoto(apiKey, base64, mediaType) {
  const prompt = 'Observa esta foto de una bascula corporal y extrae los valores visibles. Responde UNICAMENTE con JSON valido, con este formato: {"kg":numero,"bodyFatPct":numero_o_null,"musclePct":numero_o_null,"visceral":numero_o_null,"waterPct":numero_o_null}. Usa null si un dato no es visible.';
  const raw = await callClaude(apiKey, [{ type: "image", source: { type: "base64", media_type: mediaType, data: base64 } }, { type: "text", text: prompt }], 300);
  return extractJson(raw);
}
async function aiParseWatchPhoto(apiKey, base64, mediaType) {
  const prompt = 'Observa esta foto de un resumen de entrenamiento (Apple Watch u otro reloj) y extrae los valores visibles. Responde UNICAMENTE con JSON valido, con este formato: {"durationMin":numero_o_null,"hrAvg":numero_o_null,"hrMax":numero_o_null}. Usa null si un dato no es visible.';
  const raw = await callClaude(apiKey, [{ type: "image", source: { type: "base64", media_type: mediaType, data: base64 } }, { type: "text", text: prompt }], 300);
  return extractJson(raw);
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
    reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
    reader.readAsDataURL(file);
  });
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("ErrorBoundary:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="err-fallback">
          <h2>Algo falló aquí</h2>
          <p className="muted small">{String((this.state.error && this.state.error.message) || this.state.error)}</p>
          <button className="btn btn-secondary" style={{ marginTop: 12 }} onClick={() => this.setState({ error: null })}>Reintentar</button>
        </div>
      );
    }
    return this.props.children;
  }
}

function TabDia({ data, update, phases, selectedDay, setSelectedDay }) {

  function updateDay(fn) {
    update((prev) => {
      const current = prev.days[dayKey] || emptyDay();
      const next = fn(current);
      return { ...prev, days: { ...prev.days, [dayKey]: next } };
    });
  }
  function addFrequent(meal) {
    update((prev) => {
      const exists = prev.frequentFoods.some((f) => f.name.toLowerCase() === meal.name.toLowerCase());

      const nf = { id: "ff" + Date.now(), name: meal.name, kcal: meal.kcal, protein: meal.protein, carbs: meal.carbs, fat: meal.fat };
      return { ...prev, frequentFoods: [nf, ...prev.frequentFoods].slice(0, 30) };
    });

  return (
    <div>
      <DaySelector selectedDay={selectedDay} setSelectedDay={setSelectedDay} data={data} />

  function updateSeg(i, key, val) { setSegments((s) => s.map((seg, idx) => (idx === i ? { ...seg, [key]: val } : seg))); }
  function addSegRow() { setSegments((s) => [...s, { label: "", value: "" }]); }
  function removeSegRow(i) { setSegments((s) => s.filter((_, idx) => idx !== i)); }
  function reset() { setDuration(""); setHrAvg(""); setHrMax(""); setRpe(null); setNotes(""); setSegments([{ label: "", value: "" }]); setOpen(false); }

            <div className="btn-row" style={{ marginBottom: 8 }}>
              <button className={"btn" + (subType === "running" ? " btn-secondary" : "")} onClick={() => setSubType("running")}>🏃 Correr</button>

            <div><label className="field-label">FC prom</label><input type="number" inputMode="decimal" value={hrAvg} onChange={(e) => setHrAvg(e.target.value)} /></div>

function computeStats(data, phases) {
  const today = clip(todayDayNumber(), 1, TOTAL_DAYS);
  let scheduled = 0, done = 0, rpeSum = 0, rpeCount = 0;
  for (let d = 1; d <= today; d++) {
    const sched = scheduleForDay(d, phases);
    const dd = data.days[String(d)];
    if (sched.hyrox) { scheduled++; if (dd && dd.hyroxDone) done++; if (dd && dd.hyroxRpe) { rpeSum += dd.hyroxRpe; rpeCount++; } }
    if (sched.pesas) { scheduled++; if (dd && dd.pesasDone) done++; if (dd && dd.pesasRpe) { rpeSum += dd.pesasRpe; rpeCount++; } }
    if (sched.correr) { scheduled++; if (dd && dd.correrDone) done++; if (dd && dd.correrRpe) { rpeSum += dd.correrRpe; rpeCount++; } }
  }
  return { adherencePct: scheduled > 0 ? Math.round((done / scheduled) * 100) : 0, avgRpe: rpeCount > 0 ? (rpeSum / rpeCount).toFixed(1) : "—", daysElapsed: today };
}
function buildWeightSeries(data, field) {
  const pts = [];
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    const dd = data.days[String(d)];
    if (dd && dd.weight && Number.isFinite(dd.weight[field])) pts.push({ x: d, y: dd.weight[field] });
  }
  return pts;
}
function buildKcalSeries(data, phases) {
  const actual = [], target = [];
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    const dd = data.days[String(d)];
    const phase = getPhase(phases, d);
    target.push({ x: d, y: phase.kcal });
    if (dd && dd.meals && dd.meals.length) { const sum = dd.meals.reduce((a, m) => a + (m.kcal || 0), 0); actual.push({ x: d, y: sum }); }
  }
  return { actual, target };
}
function buildHrSeries(data) {
  const byDay = {};
  [...data.performance.hyrox, ...data.performance.secondary].forEach((e) => {
    if (Number.isFinite(e.hrAvg) && Number.isFinite(e.dayNumber)) { if (!byDay[e.dayNumber]) byDay[e.dayNumber] = []; byDay[e.dayNumber].push(e.hrAvg); }
  });
  return Object.keys(byDay).map((k) => ({ x: parseInt(k, 10), y: byDay[k].reduce((a, b) => a + b, 0) / byDay[k].length })).sort((a, b) => a.x - b.x);
}
function LineChart({ points, color, height, targetPoints }) {
  const width = 320; const h = height || 120; const pad = 8;
  const hasPoints = points && points.length > 0;
  const hasTarget = targetPoints && targetPoints.length > 0;
  if (!hasPoints && !hasTarget) return <div className="empty-state small">Aún no hay datos suficientes</div>;
  const allPts = (hasPoints ? points : []).concat(hasTarget ? targetPoints : []);
  const xs = allPts.map((p) => p.x); const ys = allPts.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const rangeX = (maxX - minX) || 1, rangeY = (maxY - minY) || 1;
  function sx(x) { return pad + (width - 2 * pad) * ((x - minX) / rangeX); }
  function sy(y) { return h - pad - (h - 2 * pad) * ((y - minY) / rangeY); }
  const path = hasPoints ? points.map((p, i) => (i === 0 ? "M" : "L") + sx(p.x).toFixed(1) + "," + sy(p.y).toFixed(1)).join(" ") : null;
  const targetPath = hasTarget ? targetPoints.map((p, i) => (i === 0 ? "M" : "L") + sx(p.x).toFixed(1) + "," + sy(p.y).toFixed(1)).join(" ") : null;
  const last = hasPoints ? points[points.length - 1] : null;
  return (
    <svg viewBox={"0 0 " + width + " " + h} style={{ width: "100%", height: h }} preserveAspectRatio="none">
      {targetPath && <path d={targetPath} fill="none" stroke={COLOR.faint} strokeWidth="1.5" strokeDasharray="4,3" />}
      {path && <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />}
      {last && <circle cx={sx(last.x)} cy={sy(last.y)} r="3.5" fill={color} />}
    </svg>
  );
}
function ChartCard({ title, unit, points, color, targetPoints }) {
  return (
    <div className="card">
      <div className="card-title"><h3 style={{ fontSize: 16 }}>{title}</h3>{points.length > 0 && <span className="pill">{points[points.length - 1].y.toFixed(1)} {unit}</span>}</div>
      <LineChart points={points} color={color} targetPoints={targetPoints} />
    </div>
  );
}
function TabProgreso({ data, phases }) {
  const stats = useMemo(() => computeStats(data, phases), [data, phases]);
  const weightSeries = useMemo(() => buildWeightSeries(data, "kg"), [data]);
  const fatSeries = useMemo(() => buildWeightSeries(data, "bodyFatPct"), [data]);
  const kcalSeries = useMemo(() => buildKcalSeries(data, phases), [data, phases]);
  const hrSeries = useMemo(() => buildHrSeries(data), [data]);
  return (
    <div>
      <div className="card">
        <div className="stat-grid">
          <div className="stat-box"><div className="sv">{stats.adherencePct}%</div><div className="sl">Adherencia</div></div>
          <div className="stat-box"><div className="sv">{stats.avgRpe}</div><div className="sl">RPE prom.</div></div>
          <div className="stat-box"><div className="sv">{stats.daysElapsed}/{TOTAL_DAYS}</div><div className="sl">Días</div></div>
        </div>
      </div>
      <ChartCard title="Peso" unit="kg" points={weightSeries} color={COLOR.coral} />
      <ChartCard title="% Grasa corporal" unit="%" points={fatSeries} color={COLOR.amber} />
      <ChartCard title="Kcal real vs objetivo" unit="kcal" points={kcalSeries.actual} targetPoints={kcalSeries.target} color={COLOR.blue} />
      <ChartCard title="FC promedio entrenamientos" unit="bpm" points={hrSeries} color={COLOR.teal} />
    </div>
  );
}

function TabDatos({ data, update, setData }) {
  const [apiKeyInput, setApiKeyInput] = useState(data.apiKey || "");

  const [exportText, setExportText] = useState("");
  const [importText, setImportText] = useState("");
  const [msg, setMsg] = useState("");
  const [resetArmed, setResetArmed] = useState(false);

  function saveApiKey() { update((prev) => ({ ...prev, apiKey: apiKeyInput.trim() })); setMsg("API key guardada"); setTimeout(() => setMsg(""), 2000); }

    const kcalNum = parseFloat(newFoodKcal);

    update((prev) => ({ ...prev, frequentFoods: [{ id: "ff" + Date.now(), name: newFoodName.trim(), kcal: kcalNum, protein: parseFloat(newFoodP) || 0, carbs: parseFloat(newFoodC) || 0, fat: parseFloat(newFoodF) || 0 }, ...prev.frequentFoods] }));
    setNewFoodName(""); setNewFoodKcal(""); setNewFoodP(""); setNewFoodC(""); setNewFoodF("");
  }
  function removeFood(id) { update((prev) => ({ ...prev, frequentFoods: prev.frequentFoods.filter((f) => f.id !== id) })); }
  function updatePhaseField(id, field, val) { update((prev) => ({ ...prev, plan: { ...prev.plan, phases: prev.plan.phases.map((p) => (p.id === id ? { ...p, [field]: parseFloat(val) || 0 } : p)) } })); }
  function doExport() { const text = JSON.stringify(data); setExportText(text); update((prev) => ({ ...prev, lastExportAt: new Date().toISOString() })); }
  function doImport() {

          <div><label className="field-label">Prot</label><input type="number" inputMode="decimal" value={newFoodP} onChange={(e) => setNewFoodP(e.target.value)} /></div>
          <div><label className="field-label">Carb</label><input type="number" inputMode="decimal" value={newFoodC} onChange={(e) => setNewFoodC(e.target.value)} /></div>
        </div>
        <label className="field-label">Grasa</label><input type="number" inputMode="decimal" value={newFoodF} onChange={(e) => setNewFoodF(e.target.value)} />
        <button className="btn btn-secondary" style={{ marginTop: 8 }} onClick={addFood}>+ Agregar</button>
        <div className="divider"></div>

          <div key={f.id} className="food-item">

        <button className="btn btn-danger" onClick={doReset}>{resetArmed ? "Toca de nuevo para confirmar" : "🔄 Reiniciar datos"}</button>
      </div>
    </div>
  );

  const [tab, setTab] = useState("dia");
  const [selectedDay, setSelectedDay] = useState(() => clip(todayDayNumber(), 1, TOTAL_DAYS));
  const [saveError, setSaveError] = useState(false);

  useEffect(() => { setSaveError(!saveData(data)); }, [data]);

  const update = useCallback((fn) => { setData((prev) => (typeof fn === "function" ? fn(prev) : fn)); }, []);

  const phases = data.plan.phases;
  const daysSinceExport = useMemo(() => {
    if (!data.lastExportAt) return null;
    return Math.floor((Date.now() - new Date(data.lastExportAt).getTime()) / 86400000);
  }, [data.lastExportAt]);
  const showBackupBanner = daysSinceExport === null ? todayDayNumber() > 3 : daysSinceExport > 3;
  const showApiKeyBanner = !data.apiKey;

  return (
    <div className="app-shell">
      <TopBar />
      {showApiKeyBanner && (
        <div className="banner">⚠️ Agrega tu API key en <b>Datos</b> para usar cálculo por IA y fotos.<button onClick={() => setTab("datos")}>Ir</button></div>
      )}
      {showBackupBanner && (
        <div className="banner">🗂️ Llevas {daysSinceExport === null ? "varios" : daysSinceExport} días sin exportar respaldo.<button onClick={() => setTab("datos")}>Exportar</button></div>
      )}
      {saveError && <div className="banner err">⚠️ No se pudo guardar en este dispositivo (memoria llena o modo privado).</div>}
      <ErrorBoundary key={tab}>
        {tab === "dia" && <TabDia data={data} update={update} phases={phases} selectedDay={selectedDay} setSelectedDay={setSelectedDay} />}
        {tab === "rendimiento" && <TabRendimiento data={data} update={update} selectedDay={selectedDay} />}
        {tab === "progreso" && <TabProgreso data={data} phases={phases} />}
        {tab === "datos" && <TabDatos data={data} update={update} setData={setData} />}
      </ErrorBoundary>
      <Tabbar tab={tab} setTab={setTab} />
    </div>
  );
}

/* =========================================================
   MONTAJE
   ========================================================= */
window.addEventListener("error", function (e) { console.error("Error global:", e.error || e.message); });
window.addEventListener("unhandledrejection", function (e) { console.error("Promesa no manejada:", e.reason); });

const __rootEl = document.getElementById("root");
const __root = ReactDOM.createRoot(__rootEl);
__root.render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);

</script>

<script>
(function () {
  function showFatalError(err) {
    var msg = (err && err.message) ? err.message : String(err);
    msg = msg.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    var el = document.getElementById("root");
    if (el) {
      el.innerHTML =
        '<div style="padding:50px 20px;text-align:center;color:#F2F3F5;font-family:system-ui,sans-serif;">' +
        '<h2 style="color:#FF4B3E;margin-bottom:10px;">No se pudo cargar HyroxTrack</h2>' +
        '<p style="color:#9AA1AC;font-size:13px;line-height:1.5;max-width:340px;margin:0 auto 14px;">' + msg + '</p>' +
        '<p style="color:#5C636E;font-size:12px;">Recarga la página (desliza hacia abajo o usa el botón de recargar de Safari). Si el problema sigue, revisa que tengas conexión a internet para cargar React y Babel.</p>' +
        '</div>';
    }
    if (window.console && console.error) console.error("HyroxTrack — fallo fatal de arranque:", err);
  }

  try {
    if (!window.React || !window.ReactDOM) {
      throw new Error("No se pudieron cargar React/ReactDOM (revisa tu conexión a internet).");
    }
    if (!window.Babel) {
      throw new Error("No se pudo cargar Babel (revisa tu conexión a internet).");
    }
    var srcEl = document.getElementById("app-source");
    if (!srcEl) throw new Error("Falta el bloque de código fuente de la app.");
    var source = srcEl.textContent;

    // IMPORTANTE: runtime "classic" explícito. El runtime "automatic" genera
    // imports de módulo (jsx-runtime) que fallan en un <script> normal sin
    // sistema de módulos — esa fue la causa raíz de la pantalla negra anterior.
    var result = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
      filename: "app.jsx",
    });

    var execScript = document.createElement("script");
    execScript.text = result.code;
    document.body.appendChild(execScript);
  } catch (err) {
    showFatalError(err);
  }
})();
</script>
</body>
</html>
