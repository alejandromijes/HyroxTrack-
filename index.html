<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HyroxTrack</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent2:#1f6feb;
  --green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;
  --yellow:#e3b341;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%;overscroll-behavior:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:60px;}

.app{display:flex;flex-direction:column;min-height:100vh;padding-bottom:calc(60px + var(--safe-bottom));}
.topbar{position:static;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--border);padding-left:16px;padding-right:16px;padding-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.topbar h1{font-size:16px;font-weight:700;white-space:nowrap;}
.topbar-right{display:flex;gap:6px;align-items:center;}
.topbar-btn{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--border);}
.topbar-btn:active{background:var(--accent2);}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);}
.tab-btn{flex:1;padding:8px 4px 6px;text-align:center;font-size:10px;font-weight:600;color:var(--text2);transition:color .15s;}
.tab-btn.active{color:var(--accent);}
.tab-icon{font-size:20px;display:block;margin-bottom:2px;}

.content{flex:1;padding:16px;padding-bottom:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card-subtitle{font-size:12px;color:var(--text2);margin-bottom:8px;}

.day-selector{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 12px;position:static;background:var(--bg);}
.day-selector button{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);font-size:16px;display:flex;align-items:center;justify-content:center;}
.day-selector button:active{background:var(--accent2);}
.day-label{font-size:14px;font-weight:600;min-width:140px;text-align:center;}

.check-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.check-row:last-child{border:none;}
.check-box{width:28px;height:28px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;transition:all .15s;}
.check-box.done{background:var(--green);border-color:var(--green);}
.check-label{flex:1;font-size:14px;}
.check-detail{font-size:12px;color:var(--text2);}

.rpe-select{display:flex;gap:4px;flex-wrap:wrap;}
.rpe-btn{width:28px;height:34px;border-radius:6px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.rpe-btn.active{background:var(--accent2);border-color:var(--accent);}

.macro-bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:4px;}
.macro-fill{height:100%;border-radius:4px;transition:width .3s;}
.macro-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;}

.btn{padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;text-align:center;transition:all .15s;}
.btn-primary{background:var(--accent2);color:#fff;}
.btn-primary:active{background:var(--accent);}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);}
.btn-danger{background:#da363340;color:var(--red);border:1px solid #da363380;}
.btn:disabled{opacity:.4;pointer-events:none;}

.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--border);margin:3px;}
.chip.active{background:var(--accent2);border-color:var(--accent);}

.meal-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.meal-item:last-child{border:none;}
.meal-name{font-size:13px;font-weight:600;}
.meal-macros{font-size:11px;color:var(--text2);}
.meal-kcal{font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap;margin-left:8px;}

.lift-table{width:100%;font-size:12px;border-collapse:collapse;}
.lift-table th{text-align:left;font-weight:600;padding:4px;color:var(--text2);border-bottom:1px solid var(--border);}
.lift-table td{padding:4px;}
.lift-table input{width:50px;padding:4px;font-size:12px;text-align:center;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px 16px calc(20px + var(--safe-bottom));-webkit-overflow-scrolling:touch;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}

.chart-container{padding:8px 0;}
.chart-container svg{width:100%;height:auto;}

.perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.perf-card{background:var(--surface2);border-radius:8px;padding:10px;text-align:center;}
.perf-value{font-size:20px;font-weight:700;color:var(--accent);}
.perf-label{font-size:11px;color:var(--text2);margin-top:2px;}

.expandable-header{display:flex;justify-content:space-between;align-items:center;padding:8px 0;cursor:pointer;}
.expandable-arrow{transition:transform .2s;font-size:12px;}
.expandable-arrow.open{transform:rotate(90deg);}

.progress-ring{display:flex;align-items:center;justify-content:center;position:relative;}
.progress-ring-text{position:absolute;font-size:11px;font-weight:700;}

.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.tag-cut{background:#f8514920;color:var(--red);}
.tag-maintain{background:#d2992220;color:var(--orange);}
.tag-lean{background:#3fb95020;color:var(--green);}

.empty-state{text-align:center;padding:32px 16px;color:var(--text2);}
.empty-state .icon{font-size:40px;margin-bottom:12px;}

.supp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.supp-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface2);font-size:13px;cursor:pointer;}
.supp-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;}
.supp-check.done{background:var(--green);border-color:var(--green);}

.note-area{margin-top:8px;}

.icon-btn{min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-size:15px;padding:0 4px;}
.icon-btn:active{background:var(--surface2);}
.chip-del{border-color:var(--red);color:var(--red);}
.link-btn{padding:6px 2px;text-decoration:underline;}
.banner{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;background:#d2992226;border:1px solid #d2992280;display:flex;gap:8px;align-items:center;justify-content:space-between;}
.copy-btn{min-width:32px;min-height:32px;}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:300;animation:fadeInOut 2s ease;}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-10px);}10%{opacity:1;transform:translateX(-50%) translateY(0);}80%{opacity:1;}100%{opacity:0;}}

.loading-dots::after{content:'...';animation:dots 1.5s steps(4) infinite;}
@keyframes dots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}100%{content:'';}}

.flex-row{display:flex;gap:8px;align-items:center;}
.flex-1{flex:1;}
.mt-8{margin-top:8px;}
.mt-12{margin-top:12px;}
.mb-8{margin-bottom:8px;}
.mb-12{margin-bottom:12px;}
.text-center{text-align:center;}
.text-sm{font-size:12px;}
.text-xs{font-size:11px;}
.text-muted{color:var(--text2);}
.text-accent{color:var(--accent);}
.text-green{color:var(--green);}
.text-red{color:var(--red);}
.text-orange{color:var(--orange);}
.fw-bold{font-weight:700;}
.gap-8{gap:8px;}
.w-full{width:100%;}
</style>
</head>
<body>
<div id="root"></div>
<script id="app-source" type="text/plain">
/* HyroxTrack v3.2 — 2026-10-06: base conservadora (2,000) + compensación repartida (≥100 kcal, hasta 3 días, ≤10%/día) con Aplicar/Ignorar/Deshacer */
const { useState, useEffect, useRef, useCallback, useMemo, Fragment } = React;

// ─── Constants ─────────────────────────────────────────────
const STORAGE_KEY = 'hyroxtrack_data_v2';
const VERSION = 3;
const TABS = ['Día','Rendimiento','Progreso','Datos'];
const TAB_ICONS = ['📋','🏋️','📈','⚙️'];

// Schedule: Mon=1..Sun=7; Mon/Wed=funcional, Tue/Thu=fuerza, Fri=hyroxSim
const SCHEDULE = {
  1: 'funcional',   // Lunes
  2: 'fuerza',      // Martes
  3: 'funcional',   // Miércoles
  4: 'fuerza',      // Jueves
  5: 'hyroxSim',    // Viernes
  6: 'rest',        // Sábado
  7: 'rest',        // Domingo
};

const DAY_NAMES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTH_NAMES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

const SUPP_LIST = ['proteina','creatina','multivitaminico','omega3'];

const DEFAULT_PROFILE = { heightCm:174, hrMax:185, sex:'m', surgery:'manga gástrica 2025-05' };

// Routines
const ROUTINE_A = {
  name: 'Fuerza A — Sentadilla + Empuje',
  exercises: [
    {id:'sentadilla',label:'Sentadilla',sets:4,reps:'6-8'},
    {id:'press_banca',label:'Press Banca',sets:4,reps:'5-6'},
    {id:'pm_rumano',label:'Peso Muerto Rumano',sets:4,reps:'8-10'},
    {id:'remo_polea',label:'Remo en Polea',sets:3,reps:'9-12'},
    {id:'press_militar',label:'Press Militar',sets:3,reps:'8-10'},
    {id:'laterales',label:'Elevaciones Laterales',sets:3,reps:'10-12'},
  ]
};
const ROUTINE_B = {
  name: 'Fuerza B — Peso Muerto + Jalón',
  exercises: [
    {id:'peso_muerto',label:'Peso Muerto',sets:4,reps:'5-6'},
    {id:'dominadas',label:'Dominadas / Jalón',sets:4,reps:'6-10'},
    {id:'prensa',label:'Prensa',sets:3,reps:'10'},
    {id:'press_inclinado',label:'Press Inclinado Mancuernas',sets:3,reps:'12'},
    {id:'remo_unilateral',label:'Remo Unilateral',sets:3,reps:'10'},
    {id:'brazos',label:'Brazos (Curl)',sets:2,reps:'10-15'},
    {id:'rueda_abs',label:'Rueda Abdominal',sets:3,reps:'12'},
  ]
};
const ROUTINE_FULL = {
  name: 'Full Body',
  exercises: [
    {id:'sentadilla',label:'Sentadilla',sets:3,reps:'6-8'},
    {id:'press_banca',label:'Press Banca',sets:3,reps:'5-6'},
    {id:'remo_polea',label:'Remo en Polea',sets:3,reps:'9-12'},
    {id:'press_militar',label:'Press Militar',sets:3,reps:'8-10'},
    {id:'pm_rumano',label:'Peso Muerto Rumano',sets:3,reps:'8-10'},
  ]
};

// ─── Utility ───────────────────────────────────────────────
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateAdd(str,n){ const d=new Date(str+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(str){
  const d=new Date(str+'T12:00:00');
  return `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
}
function isoWeekday(str){ const d=new Date(str+'T12:00:00'); return d.getDay()||7; } // 1=Mon..7=Sun
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function pct(v,t){ return t?Math.round(100*v/t):0; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function getScheduleType(dateStr){
  const wd = isoWeekday(dateStr);
  return SCHEDULE[wd] || 'rest';
}

function getRoutineForDate(dateStr){
  // Count fuerza days from plan start to decide A/B alternation
  // Simple: even fuerza-day = A, odd = B
  const type = getScheduleType(dateStr);
  if(type !== 'fuerza') return null;
  const d = new Date(dateStr+'T12:00:00');
  const ref = new Date('2026-09-22T12:00:00');
  const diffDays = Math.round((d-ref)/(86400000));
  let fuerzaCount = 0;
  for(let i=0; i<=diffDays; i++){
    const dd = dateAdd('2026-09-22',i);
    if(getScheduleType(dd)==='fuerza') fuerzaCount++;
  }
  return fuerzaCount%2===1 ? ROUTINE_A : ROUTINE_B;
}

// ─── Storage ───────────────────────────────────────────────
function safeGet(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object') return null;
    return parsed;
  }catch(e){ return null; }
}

function isObj(x){ return !!x && typeof x==='object' && !Array.isArray(x); }

function normalizeData(d){
  if(!isObj(d)) return defaultData();
  const def = defaultPlan();
  d.version = VERSION;
  if(typeof d.apiKey!=='string') d.apiKey = '';
  if(!isObj(d.profile)) d.profile = {...DEFAULT_PROFILE};
  if(!isObj(d.plan)) d.plan = def;
  if(!d.plan.startDate) d.plan.startDate = def.startDate;
  if(Array.isArray(d.plan.blocks)) d.plan.blocks = d.plan.blocks.filter(b=>isObj(b) && b.id);
  if(!Array.isArray(d.plan.blocks) || !d.plan.blocks.length) d.plan.blocks = def.blocks;

  // Migración de dieta: la nueva dieta (2,100 base / 2,500 flex) reemplaza los macros de los bloques.
  // Los bloques anteriores se conservan en plan.legacyBlocks para no perder nada.
  if((d.plan.dietVersion||0) < 2){
    if(!Array.isArray(d.plan.legacyBlocks)) d.plan.legacyBlocks = d.plan.blocks.map(b=>({...b}));
    d.plan.blocks = d.plan.blocks.map(b=>{
      const df = def.blocks.find(x=>x.id===b.id);
      return df ? {...b,kcal:df.kcal,kcalFlex:df.kcalFlex,protein:df.protein,carbs:df.carbs,fat:df.fat,note:df.note}
                : {...b,kcalFlex:b.kcalFlex||b.kcal};
    });
    d.plan.dietVersion = 2;
  }
  if(d.plan.dietVersion < 3){
    d.plan.blocks = d.plan.blocks.map(b=>{ const df = def.blocks.find(x=>x.id===b.id); return df ? {...b,note:df.note} : b; });
    d.plan.dietVersion = 3;
  }
  // v4 (oct 2026): base conservadora en Definición 1 → 2,000 kcal / flex 2,400 / 175P / 190C / 60G.
  // Solo si el bloque sigue con los valores originales: si lo editaste a mano, se respeta tu edición.
  // Los valores anteriores se guardan en block.past para que los días ya registrados conserven su objetivo.
  if(d.plan.dietVersion < 4){
    const until = (()=>{ const y = dateAdd(todayStr(),-1); return y > '2026-10-06' ? y : '2026-10-06'; })();
    d.plan.blocks = d.plan.blocks.map(b=>{
      if(b.id!=='b1') return b;
      const orig = Number(b.kcal)===2100 && Number(b.kcalFlex)===2500 && Number(b.protein)===180 && Number(b.carbs)===200 && Number(b.fat)===67;
      if(!orig) return b;
      const past = Array.isArray(b.past) ? b.past : [];
      return {...b,kcal:2000,kcalFlex:2400,protein:175,carbs:190,fat:60,
        past:[...past,{until,kcal:2100,kcalFlex:2500,protein:180,carbs:200,fat:67}],
        note:'Base conservadora 2,000 kcal (flex Vie-Sáb 2,400). Antes 2,100/2,500. Excedentes se compensan al día siguiente.'};
    });
    d.plan.dietVersion = 4;
  }
  d.plan.blocks = d.plan.blocks.map(b=>{
    const kcal = Number(b.kcal)||2100;
    const out = {...b,name:String(b.name||b.id),days:Math.max(1,Number(b.days)||28),kcal,kcalFlex:Number(b.kcalFlex)||kcal,
      protein:Number(b.protein)||0,carbs:Number(b.carbs)||0,fat:Number(b.fat)||0};
    if(Array.isArray(b.past)){
      out.past = b.past.filter(p=>isObj(p) && /^\d{4}-\d{2}-\d{2}$/.test(String(p.until))).map(p=>{
        const pk = Number(p.kcal)||kcal;
        return {until:String(p.until),kcal:pk,kcalFlex:Number(p.kcalFlex)||pk,protein:Number(p.protein)||0,carbs:Number(p.carbs)||0,fat:Number(p.fat)||0};
      });
    } else delete out.past;
    return out;
  });
  d.plan.flexDays = Array.isArray(d.plan.flexDays) ? d.plan.flexDays.map(Number).filter(x=>x>=1&&x<=7) : [5,6];

  // Rendimiento: estructura {hyrox:[],secondary:[]}; migra el formato "perf" de versiones intermedias
  if(Array.isArray(d.performance)) d.performance = {hyrox:[],secondary:d.performance};
  if(!isObj(d.performance)) d.performance = {hyrox:[],secondary:[]};
  ['hyrox','secondary'].forEach(g=>{
    d.performance[g] = Array.isArray(d.performance[g]) ? d.performance[g].filter(isObj).map(e=>({...e,id:e.id||('p'+uid())})) : [];
  });
  if(Array.isArray(d.perf)){
    d.perf.forEach(p=>{
      if(!p) return;
      const e = {id:p.id||('p'+uid()),type:p.type||'benchmark',durationMin:Math.round(((p.totalSec||0)/60)*100)/100,hrAvg:null,hrMax:null,rpe:null,notes:p.note||'',segments:[],dateISO:p.date||todayStr()};
      (e.type==='hyrox_sim'||e.type==='hyrox_race' ? d.performance.hyrox : d.performance.secondary).push(e);
    });
  }
  delete d.perf;

  // Comidas frecuentes
  if(Array.isArray(d.frequentFoods)) d.frequentFoods = d.frequentFoods.filter(f=>isObj(f) && f.name).map(f=>({...f,id:f.id||('ff'+uid()),name:String(f.name),kcal:Number(f.kcal)||0,protein:Number(f.protein)||0,carbs:Number(f.carbs)||0,fat:Number(f.fat)||0}));
  if(!Array.isArray(d.frequentFoods)) d.frequentFoods = DEFAULT_FREQUENT.map(f=>({...f}));

  // Revisiones: quita duplicados exactos (bug antiguo)
  if(!Array.isArray(d.reviews)) d.reviews = [];
  const seen = new Set();
  d.reviews = d.reviews.filter(r=>{
    if(!r || typeof r!=='object') return false;
    const key = JSON.stringify({...r,id:undefined});
    if(seen.has(key)) return false;
    seen.add(key); return true;
  }).map(r=>r.id ? r : {...r,id:'r'+uid()+Math.random().toString(36).slice(2,5)});

  // Compensaciones diarias (v3.2): {fecha:{status:'applied'|'dismissed',kcal,carbs,fat,fromDate,excess,at}}
  if(!isObj(d.adjustments)) d.adjustments = {};
  Object.keys(d.adjustments).forEach(k=>{
    const a = d.adjustments[k];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !isObj(a) || (a.status!=='applied' && a.status!=='dismissed')){ delete d.adjustments[k]; return; }
    d.adjustments[k] = {...a,kcal:Number(a.kcal)||0,carbs:Number(a.carbs)||0,fat:Number(a.fat)||0,remaining:Math.max(0,Number(a.remaining)||0),daysLeft:Math.max(0,Number(a.daysLeft)||0)};
  });

  // Días
  if(!isObj(d.days)) d.days = {};
  Object.keys(d.days).forEach(k=>{
    let day = d.days[k];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)){ return; }
    if(!isObj(day)){ d.days[k] = emptyDay(); return; }
    if(!Array.isArray(day.meals)) day.meals = [];
    const ids = new Set();
    day.meals = day.meals.filter(m=>m && typeof m==='object').map(m=>{
      const mm = {...m,name:String(m.name||'Comida'),kcal:Number(m.kcal)||0,protein:Number(m.protein)||0,carbs:Number(m.carbs)||0,fat:Number(m.fat)||0};
      if(!mm.id || ids.has(mm.id)) mm.id = uid()+Math.random().toString(36).slice(2,5);
      ids.add(mm.id);
      return mm;
    });
    if(!isObj(day.weight)) day.weight = {};
    if(!isObj(day.lifts)) day.lifts = {};
    if(!isObj(day.supps)) day.supps = {};
    if(typeof day.note!=='string') day.note = day.note==null?'':String(day.note);
    if(day.hyroxSimDone===undefined) day.hyroxSimDone = false;
    if(day.hyroxSimRpe===undefined) day.hyroxSimRpe = null;
    if(day.hyroxSimMin===undefined) day.hyroxSimMin = null;
    // Báscula: una versión anterior guardaba la grasa visceral como "visceralFat"
    if(day.weight.visceralFat!=null){
      if(day.weight.visceral==null) day.weight.visceral = day.weight.visceralFat;
      delete day.weight.visceralFat;
    }
  });
  return d;
}

let LOAD_WARNING = '';
let SKIP_INITIAL_SAVE = false;
function loadData(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
  const d = safeGet(STORAGE_KEY);
  if(!d){
    if(raw){
      // Datos ilegibles: se guardan aparte antes de empezar de cero, para poder recuperarlos
      try{ localStorage.setItem(STORAGE_KEY+'_corrupt_'+Date.now(), raw); }catch(e){ SKIP_INITIAL_SAVE = true; }
      LOAD_WARNING = 'Los datos guardados estaban dañados. Se apartó una copia y la app arrancó vacía: restaura tu último backup con 📂.';
    }
    return defaultData();
  }
  try{ return normalizeData(d); }
  catch(e){
    try{ localStorage.setItem(STORAGE_KEY+'_corrupt_'+Date.now(), raw); }catch(_){ SKIP_INITIAL_SAVE = true; }
    LOAD_WARNING = 'No se pudieron leer algunos datos ('+e.message+'). Se apartó una copia; restaura tu último backup con 📂.';
    return defaultData();
  }
}

let saveWarned = false;
let lastSaveOk = true;
function saveData(d){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    saveWarned = false;
    lastSaveOk = true;
    return true;
  }catch(e){
    lastSaveOk = false;
    if(!saveWarned){
      saveWarned = true;
      setTimeout(()=>alert('⚠️ No se pudo guardar en este dispositivo ('+(e&&e.name||'error')+'). Haz un backup (💾) ahora para no perder datos.'),0);
    }
    return false;
  }
}

// ─── Block/Phase logic ─────────────────────────────────────
function getCurrentBlock(plan, dateStr){
  if(!plan||!plan.blocks||!plan.startDate) return {block:null,blockIdx:0,dayInBlock:0};
  const start = new Date(plan.startDate+'T12:00:00');
  const cur = new Date(dateStr+'T12:00:00');
  let elapsed = Math.max(0, Math.round((cur-start)/86400000));
  let acc = 0;
  for(let i=0;i<plan.blocks.length;i++){
    const b = plan.blocks[i];
    if(elapsed < acc + b.days) return {block:b, blockIdx:i, dayInBlock:elapsed-acc+1};
    acc += b.days;
  }
  const last = plan.blocks[plan.blocks.length-1];
  return {block:last, blockIdx:plan.blocks.length-1, dayInBlock:last.days};
}

let FLEX_DAYS = [5,6]; // ISO: 1=Lun..7=Dom. Se sincroniza desde plan.flexDays en App.
function isFlexDay(dateStr){
  return FLEX_DAYS.includes(isoWeekday(dateStr));
}

// Objetivos vigentes en una fecha: si el bloque cambió a mitad de camino, los días anteriores usan block.past
function blockValuesOn(block, dateStr){
  if(!block) return null;
  const past = Array.isArray(block.past) ? block.past.filter(p=>p && p.until && dateStr<=p.until).sort((a,b)=>a.until<b.until?-1:a.until>b.until?1:0) : [];
  return past.length ? {...block,...past[0]} : block;
}

function getTargetKcal(block, dateStr){
  if(!block) return 2100;
  const v = blockValuesOn(block, dateStr);
  const base = v.kcal || 2100;
  return isFlexDay(dateStr) ? (v.kcalFlex || base) : base;
}

// Objetivos base del día (misma lógica de siempre: en día flex las kcal extra van 60% carbos / 40% grasa)
function baseTargets(block, dateStr){
  const v = blockValuesOn(block, dateStr);
  const kcal = getTargetKcal(block, dateStr);
  const extra = (isFlexDay(dateStr) && v) ? Math.max(0, kcal - (v.kcal||kcal)) : 0;
  return {
    kcal,
    protein: v ? v.protein : 180,
    carbs: (v ? v.carbs : 200) + Math.round(extra*0.6/4),
    fat: (v ? v.fat : 67) + Math.round(extra*0.4/9)
  };
}

// ─── Compensación diaria (carryover) ─────────────────────────
// Base científica: la grasa corporal responde al balance de energía promedio de varios días, no de uno solo.
// · Solo se compensan excedentes ≥100 kcal (por debajo es ruido del registro: etiquetas/fotos/restaurantes ±10-20%).
// · El excedente se reparte en hasta 3 días, máx. ~10% de la base de cada día (≈200 kcal), para no afectar entrenamiento.
// · La proteína nunca se toca. Se recorta primero grasa (piso 50 g, ≥20% de las kcal) y luego carbos (piso 150 g, combustible Hyrox).
// · Lo que no se alcance a compensar en 3 días queda en el promedio semanal (se ve en la revisión de bloque).
const CARRY = {minExcess:100, dailyCapPct:0.10, maxDays:3, fatFloor:50, carbsFloor:150, minCarry:50};

function dayTotals(day){
  const ms = (day && Array.isArray(day.meals)) ? day.meals : [];
  const s = k => ms.reduce((a,m)=>a+(Number(m[k])||0),0);
  return {kcal:s('kcal'),protein:s('protein'),carbs:s('carbs'),fat:s('fat')};
}

function appliedAdjustment(data, dateStr){
  const a = data && data.adjustments && data.adjustments[dateStr];
  return (a && a.status==='applied') ? a : null;
}

function effectiveTargets(data, dateStr){
  const {block} = getCurrentBlock(data.plan, dateStr);
  const t = baseTargets(block, dateStr);
  const a = appliedAdjustment(data, dateStr);
  if(!a) return {...t, base:t, adj:null};
  return {kcal:t.kcal+a.kcal, protein:t.protein, carbs:t.carbs+a.carbs, fat:t.fat+a.fat, base:t, adj:a};
}

function carryoverSuggestion(data, dateStr){
  const prev = dateAdd(dateStr,-1);
  // 1) Excedente nuevo de ayer (solo si ayer quedó registrado: ≥50% de su objetivo)
  let excess = 0, consumed = null, prevTarget = null;
  const day = data.days && data.days[prev];
  if(day && Array.isArray(day.meals) && day.meals.length){
    const tot = dayTotals(day);
    const tgtPrev = effectiveTargets(data, prev);
    if(tot.kcal >= 0.5*tgtPrev.kcal){
      consumed = Math.round(tot.kcal); prevTarget = tgtPrev.kcal;
      const ex = Math.round(tot.kcal - tgtPrev.kcal);
      if(ex >= CARRY.minExcess) excess = ex;
    }
  }
  // 2) Pendiente de una compensación aplicada ayer
  const pa = data.adjustments && data.adjustments[prev];
  const carried = (pa && pa.status==='applied' && Number(pa.remaining)>0 && Number(pa.daysLeft)>0) ? Math.round(Number(pa.remaining)) : 0;
  const total = excess + carried;
  if(total <= 0) return null;
  const daysLeft = excess>0 ? CARRY.maxDays-1 : Math.max(0, Number(pa.daysLeft)-1);
  const today = baseTargets(getCurrentBlock(data.plan, dateStr).block, dateStr);
  const cap = Math.round(today.kcal*CARRY.dailyCapPct);
  const goal = Math.min(total, cap);
  const fatCut = Math.max(0, Math.min(Math.floor(goal/9), Math.floor(today.fat - CARRY.fatFloor)));
  const carbsCut = Math.max(0, Math.min(Math.floor((goal - fatCut*9)/4), Math.floor(today.carbs - CARRY.carbsFloor)));
  const cut = fatCut*9 + carbsCut*4;
  if(cut <= 0) return null;
  let rest = total - cut;
  if(rest < CARRY.minCarry) rest = 0;
  return {fromDate:prev, consumed, prevTarget, excess, carried, total,
    kcal:-cut, fat:-fatCut, carbs:-carbsCut,
    remaining: daysLeft>0 ? rest : 0, daysLeft: daysLeft>0 ? daysLeft : 0, dropped: daysLeft>0 ? 0 : rest};
}

const MODEL_CHAIN = ['claude-sonnet-5-5','claude-haiku-4-5-20251001','claude-opus-5-5','claude-sonnet-4-20250514'];
let workingModel = null;

async function callClaude(apiKey, messages, maxTokens=1024){
  const key = String(apiKey||'').trim();
  if(!key) throw new Error('Falta la API key (pestaña Datos)');
  const models = workingModel ? [workingModel, ...MODEL_CHAIN.filter(m=>m!==workingModel)] : MODEL_CHAIN;
  let lastErr = '';
  for(const model of models){
    let res;
    const ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>ctrl.abort(), 90000) : null;
    try{
      res = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key':key,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body:JSON.stringify({model,max_tokens:maxTokens,messages}),
        signal: ctrl ? ctrl.signal : undefined
      });
    }catch(netErr){
      if(timer) clearTimeout(timer);
      if(netErr && netErr.name==='AbortError') throw new Error('La IA tardó demasiado en responder. Intenta de nuevo.');
      throw new Error('Sin conexión con la API. Revisa tu internet e intenta de nuevo.');
    }
    if(timer) clearTimeout(timer);
    if(res.ok){
      workingModel = model;
      const data = await res.json();
      const block = (data.content||[]).find(b=>b && b.type==='text') || (data.content||[])[0];
      return (block && block.text) || '';
    }
    let detail = '';
    try{ const j = await res.json(); detail = j?.error?.message || ''; }catch(e){}
    lastErr = `API ${res.status}${detail?': '+detail:''} (modelo ${model})`;
    if(res.status===401 || res.status===403) throw new Error('API key inválida o sin permiso. Revísala en la pestaña Datos.');
    if(res.status===429) throw new Error('Límite de uso de la API alcanzado. Espera un minuto e intenta de nuevo.');
    if(res.status===400 && /credit|balance/i.test(detail)) throw new Error('Tu cuenta de la API no tiene saldo. Recárgala en console.anthropic.com.');
    // 404 = modelo no disponible; 5xx/529 = servidor saturado → probar el siguiente modelo
    if(!(res.status===404 || res.status>=500)) throw new Error(lastErr);
  }
  throw new Error(lastErr || 'API sin respuesta');
}

async function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function prepareImage(file){
  // Resize/convert to JPEG (gallery photos can be HEIC or >5MB, which the API rejects)
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((res,rej)=>{const i=new Image();const t=setTimeout(()=>rej(new Error('timeout imagen')),15000);i.onload=()=>{clearTimeout(t);res(i);};i.onerror=e=>{clearTimeout(t);rej(e);};i.src=url;});
    const max = 1600;
    const scale = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*scale); c.height = Math.round(img.naturalHeight*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    const data = c.toDataURL('image/jpeg',0.85).split(',')[1];
    if(data) return {b64:data, mediaType:'image/jpeg'};
  }catch(e){ console.warn('prepareImage fallback',e); }
  return {b64: await fileToBase64(file), mediaType: file.type || 'image/jpeg'};
}

// ─── Expandable Routine / Lifts ────────────────────────────
function getLastLift(days,date,exId){
  const keys = Object.keys(days||{}).filter(k=>k<date).sort().reverse();
  for(const k of keys){
    const sets = days[k] && days[k].lifts && days[k].lifts[exId];
    if(Array.isArray(sets) && sets.some(x=>x && (x.w>0 || x.r>0))) return {date:k,sets};
  }
  return null;
}

function ExpandableRoutine({routine,lifts,onUpdateLifts,days,date}){
  const [open,setOpen] = useState(true);
  if(!routine) return null;

  function blankSets(ex){ return Array.from({length:ex.sets},()=>({w:0,r:0,rir:2})); }

  function updateSet(ex,setIdx,field,val){
    const n = val===''?0:Number(String(val).replace(',','.'));
    onUpdateLifts(prev=>{
      const cur = {...prev};
      cur[ex.id] = [...(cur[ex.id] || blankSets(ex))];
      while(cur[ex.id].length<ex.sets) cur[ex.id].push({w:0,r:0,rir:2});
      cur[ex.id][setIdx] = {...cur[ex.id][setIdx],[field]:isFinite(n)?n:0};
      return cur;
    });
  }

  function copyPrevSet(ex,setIdx){
    if(setIdx===0) return;
    onUpdateLifts(prev=>{
      if(!prev[ex.id] || !prev[ex.id][setIdx-1]) return prev;
      const cur = {...prev};
      cur[ex.id] = [...cur[ex.id]];
      cur[ex.id][setIdx] = {...cur[ex.id][setIdx-1]};
      return cur;
    });
  }

  function useLast(ex,last){
    const mine = lifts[ex.id];
    if(Array.isArray(mine) && mine.some(x=>x && (x.w>0||x.r>0)) && !window.confirm('Ya capturaste sets de '+ex.label+' hoy. ¿Reemplazarlos con la carga anterior?')) return;
    const src = last.sets;
    onUpdateLifts(prev=>({...prev,[ex.id]:Array.from({length:ex.sets},(_,i)=>{
      const p = src[i] || src[src.length-1] || {};
      return {w:p.w||0, r:p.r||0, rir:p.rir==null?2:p.rir};
    })}));
  }

  return React.createElement('div',{className:'card'},
    React.createElement('div',{className:'expandable-header',onClick:()=>setOpen(!open)},
      React.createElement('div',{className:'card-title',style:{margin:0}},'🏋️ ',routine.name),
      React.createElement('span',{className:'expandable-arrow'+(open?' open':'')},'▶')
    ),
    open && routine.exercises.map(ex=>{
      const sets = lifts[ex.id] || blankSets(ex);
      const last = getLastLift(days,date,ex.id);
      const topReps = parseInt(String(ex.reps).split('-').pop(),10) || 0;
      const hitTop = last && topReps && last.sets.every(x=>x && x.r>=topReps && x.w>0);
      const lastTxt = last ? last.sets.map(x=>(x.w?x.w:'–')+'×'+(x.r||0)).join(' · ') : null;
      return React.createElement('div',{key:ex.id,style:{marginTop:14}},
        React.createElement('div',{className:'text-sm fw-bold'},ex.label,' ',
          React.createElement('span',{className:'text-muted'},ex.sets+'×'+ex.reps)
        ),
        last && React.createElement('div',{className:'text-xs text-muted',style:{margin:'4px 0 6px',lineHeight:1.5}},
          '📌 Última vez ('+fmtDate(last.date)+'): ',
          React.createElement('span',{className:'text-accent'},lastTxt),
          ' ',
          React.createElement('button',{className:'text-xs text-accent link-btn',onClick:()=>useLast(ex,last)},'Usar esta carga'),
          hitTop && React.createElement('div',{className:'text-green'},'💡 Llegaste al tope de reps: prueba subir ~2.5 kg')
        ),
        !last && React.createElement('div',{className:'text-xs text-muted',style:{margin:'4px 0 6px'}},'Sin registro previo'),
        React.createElement('table',{className:'lift-table'},
          React.createElement('thead',null,
            React.createElement('tr',null,
              React.createElement('th',null,'Set'),
              React.createElement('th',null,'Kg'),
              React.createElement('th',null,'Reps'),
              React.createElement('th',null,'RIR'),
              React.createElement('th',null,'')
            )
          ),
          React.createElement('tbody',null,
            sets.map((st,i)=>{
              const pv = last ? (last.sets[i] || last.sets[last.sets.length-1] || {}) : {};
              return React.createElement('tr',{key:i},
                React.createElement('td',null,i+1),
                React.createElement('td',null,React.createElement('input',{type:'number',inputMode:'decimal',value:st.w||'',placeholder:pv.w?String(pv.w):'',onChange:e=>updateSet(ex,i,'w',e.target.value)})),
                React.createElement('td',null,React.createElement('input',{type:'number',inputMode:'numeric',value:st.r||'',placeholder:pv.r?String(pv.r):'',onChange:e=>updateSet(ex,i,'r',e.target.value)})),
                React.createElement('td',null,React.createElement('input',{type:'number',inputMode:'numeric',value:st.rir===0?'0':st.rir||'',onChange:e=>updateSet(ex,i,'rir',e.target.value)})),
                React.createElement('td',null,i>0&&React.createElement('button',{className:'text-xs text-accent copy-btn','aria-label':'Copiar set anterior',onClick:()=>copyPrevSet(ex,i)},'⬆'))
              );
            })
          )
        )
      );
    })
  );
}

// ─── Weight Card ───────────────────────────────────────────
const W_FIELDS = {
  kg:{label:'Peso',unit:'kg',min:30,max:250,dec:2},
  bodyFatPct:{label:'Grasa',unit:'%',min:3,max:60,dec:1},
  musclePct:{label:'Músculo',unit:'%',min:15,max:80,dec:1},
  visceral:{label:'G. visceral',unit:'',min:1,max:30,dec:0},
  waterPct:{label:'Agua',unit:'%',min:30,max:80,dec:1}
};
const W_ALIASES = {
  kg:['kg','peso','weight','weightkg','pesokg'],
  bodyFatPct:['bodyfatpct','bodyfat','grasa','grasacorporal','grasacorporalpct','fatpct','fat'],
  musclePct:['musclepct','skeletalmusclepct','skeletalmuscle','musculo','musculoesqueletico','muscle'],
  visceral:['visceral','visceralfat','grasavisceral','visceralfatlevel'],
  waterPct:['waterpct','water','bodywater','bodywaterpct','agua','aguacorporal']
};

function toNum(v,dotThousands){
  if(v==null || v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  const m0 = String(v).match(/-?\d[\d.,]*/);
  if(!m0) return null;
  let n = m0[0].replace(/[.,]$/,'');
  if(/^-?[1-9]\d{0,2}(,\d{3})+(\.\d+)?$/.test(n)) n = n.replace(/,/g,'');                 // 1,200 / 1,200.5 → miles
  else if(/^-?\d{1,3}(\.\d{3})+,\d+$/.test(n)) n = n.replace(/\./g,'').replace(',','.'); // 1.234,5
  else if(dotThousands && /^-?[1-9]\d{0,2}(\.\d{3})+$/.test(n)) n = n.replace(/\./g,'');  // 1.200 kcal
  else if(/^-?\d+,\d+$/.test(n)) n = n.replace(',','.');                              // 79,8 → decimal
  n = n.replace(/,/g,'');
  const x = parseFloat(n);
  return isFinite(x) ? x : null;
}

function extractJSON(text){
  if(!text) return null;
  const t = String(text).replace(/```json|```/gi,'');
  const start = t.search(/[\[{]/);
  if(start<0) return null;
  const open = t[start], close = open==='{'?'}':']';
  let depth=0, inStr=false, esc=false;
  for(let i=start;i<t.length;i++){
    const c = t[i];
    if(inStr){ if(esc) esc=false; else if(c==='\\') esc=true; else if(c==='"') inStr=false; continue; }
    if(c==='"'){ inStr=true; continue; }
    if(c===open) depth++;
    else if(c===close){
      depth--;
      if(depth===0){ try{ return JSON.parse(t.slice(start,i+1)); }catch(e){ return null; } }
    }
  }
  return null;
}

function normalizeScale(json){
  const out = {}, bad = [];
  const lower = {};
  Object.keys(json||{}).forEach(k=>{ lower[String(k).toLowerCase().replace(/[^a-z0-9]/g,'')] = json[k]; });
  Object.keys(W_ALIASES).forEach(k=>{
    let v = null;
    for(const a of W_ALIASES[k]){
      if(lower[a]!=null){ v = toNum(lower[a]); if(v!=null) break; }
    }
    if(v==null) return;
    const f = W_FIELDS[k];
    if(v<f.min || v>f.max){ bad.push(k); return; }
    out[k] = Number(v.toFixed(f.dec));
  });
  return {out,bad};
}

function WeightCard({weight,onUpdate,apiKey}){
  const busy = useRef(false);
  const [loading,setLoading] = useState(false);
  const [notice,setNotice] = useState('');
  const fileRef = useRef();

  async function handlePhoto(e){
    const files = Array.from(e.target.files||[]);
    if(fileRef.current) fileRef.current.value='';
    if(!files.length||!apiKey||busy.current) return;
    busy.current = true;
    setLoading(true); setNotice('');
    const acc = {}; const badAll = []; const errs = [];
    for(const file of files){
      try{
        const {b64,mediaType} = await prepareImage(file);
        const resp = await callClaude(apiKey,[{
          role:'user',
          content:[
            {type:'image',source:{type:'base64',media_type:mediaType,data:b64}},
            {type:'text',text:'Esta es una captura de la app o báscula RENPHO. Extrae SOLO los valores que veas escritos con claridad. Reglas: "kg" = peso corporal en kilogramos (si está en lb, conviértelo a kg); "bodyFatPct" = Grasa corporal / Body Fat en %; "musclePct" = Músculo esquelético / Skeletal Muscle en % (NO la masa muscular en kg); "visceral" = Grasa visceral / Visceral Fat (número entero sin unidad, normalmente entre 1 y 30); "waterPct" = Agua corporal / Body Water en %. No calcules ni adivines: si un valor no aparece en la imagen usa null. Responde SOLO con JSON: {"kg":number|null,"bodyFatPct":number|null,"musclePct":number|null,"visceral":number|null,"waterPct":number|null}'}
          ]
        }],600);
        const json = extractJSON(resp);
        if(!json || typeof json!=='object') throw new Error('respuesta ilegible de la IA');
        const {out,bad} = normalizeScale(json);
        Object.keys(out).forEach(k=>{ if(acc[k]===undefined) acc[k]=out[k]; });
        bad.forEach(k=>badAll.push(k));
      }catch(err){ errs.push(err.message); }
    }
    const read = Object.keys(acc);
    if(read.length){
      onUpdate(prev=>({...prev,...acc,time:prev.time||new Date().toISOString()}));
    }
    const missing = Object.keys(W_FIELDS).filter(k=>acc[k]===undefined);
    let msg = read.length
      ? '✓ Leí: '+read.map(k=>W_FIELDS[k].label+' '+acc[k]).join(' · ')+'.'
      : 'No pude leer ningún valor.';
    if(missing.length && read.length) msg += ' No aparecen: '+missing.map(k=>W_FIELDS[k].label).join(', ')+' (captúralos a mano o sube otra captura).';
    if(badAll.length) msg += ' Descarté por fuera de rango: '+[...new Set(badAll)].map(k=>W_FIELDS[k].label).join(', ')+'.';
    if(errs.length) msg += ' Error: '+errs[0];
    setNotice(msg);
    busy.current = false;
    setLoading(false);
  }

  const field = (k,step)=>React.createElement('div',{key:k},
    React.createElement('div',{className:'text-xs text-muted'},W_FIELDS[k].label+(W_FIELDS[k].unit?' ('+W_FIELDS[k].unit+')':'')),
    React.createElement('input',{type:'number',inputMode:'decimal',step,value:weight[k]==null?'':weight[k],
      onChange:e=>{const v=e.target.value; onUpdate(prev=>({...prev,[k]:v===''?null:Number(v)}));}})
  );

  return React.createElement('div',{className:'card'},
    React.createElement('div',{className:'card-title'},'⚖️ Peso corporal'),
    React.createElement('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
      field('kg','0.05'),
      field('bodyFatPct','0.1'),
      field('musclePct','0.1'),
      field('visceral','1'),
      field('waterPct','0.1')
    ),
    React.createElement('div',{className:'mt-12'},
      React.createElement('input',{ref:fileRef,type:'file',accept:'image/*',multiple:true,style:{display:'none'},onChange:handlePhoto}),
      React.createElement('button',{className:'btn btn-secondary w-full',onClick:()=>fileRef.current?.click(),disabled:loading||!apiKey},
        loading?'Analizando...':'📷 Foto de báscula (1 o varias capturas)'
      ),
      notice && React.createElement('div',{className:'text-xs text-muted',style:{marginTop:8,lineHeight:1.5}},notice)
    )
  );
}

function r1(v){ return Math.round((Number(v)||0)*10)/10; }

function MealsCard({meals,onUpdate,apiKey,frequent,onUpdateFrequent,date,notify}){
  const [panel,setPanel] = useState(false);        // panel de agregar abierto
  const [editMeal,setEditMeal] = useState(null);   // comida en edición (nueva o existente)

  const [filter,setFilter] = useState('');
  const [editFreq,setEditFreq] = useState(false);
  const busy = useRef(false);
  const fileRef = useRef();

  const FREQUENT = Array.isArray(frequent) ? frequent : DEFAULT_FREQUENT;
  const q = filter.trim().toLowerCase();
  const shownFreq = FREQUENT.filter(f=>!q || String(f.name||'').toLowerCase().includes(q));

  function flash(msg){ setNotice(msg); }

  function addMeals(list,fromAI){
    onUpdate(prev=>[...prev,...list]);
    const msg = '✓ Agregado: '+list.map(m=>m.name).join(', ');
    flash(msg);
    // Si la IA tardó y cambiaste de día, el aviso global indica a qué día se agregó
    if(fromAI && notify) notify(msg.slice(0,60)+(date?' ('+fmtDate(date)+')':''));
  }

  function deleteFrequent(f){
    if(!onUpdateFrequent) return;
    if(!window.confirm('¿Quitar "'+f.name+'" de frecuentes?')) return;
    onUpdateFrequent(prev=>(Array.isArray(prev)?prev:DEFAULT_FREQUENT).filter(x=>x!==f && !(x.id && x.id===f.id)));
  }

  function addFrequent(f){
    addMeals([{name:String(f.name||'Comida'),kcal:Math.round(Number(f.kcal)||0),protein:r1(f.protein),carbs:r1(f.carbs),fat:r1(f.fat),id:uid(),source:'frecuente',time:nowHM()}]);
  }

  function saveAsFrequent(m){
    if(!onUpdateFrequent) return;
    const exists = FREQUENT.some(f=>String(f.name).trim().toLowerCase()===String(m.name).trim().toLowerCase());
    if(exists){ flash('"'+m.name+'" ya está en frecuentes'); return; }
    const item = {id:'ff'+uid(),name:m.name,kcal:m.kcal||0,protein:m.protein||0,carbs:m.carbs||0,fat:m.fat||0};

  function parseMeals(resp,source){
    let arr = extractJSON(resp);
    if(arr && !Array.isArray(arr)) arr = Array.isArray(arr.meals)?arr.meals : Array.isArray(arr.items)?arr.items : (arr.name?[arr]:null);
    if(!Array.isArray(arr)) throw new Error('No pude interpretar la respuesta de la IA, intenta de nuevo');
    const out = arr.filter(m=>m&&m.name).map(m=>{
      const p = r1(toNum(m.protein)), c = r1(toNum(m.carbs)), f = r1(toNum(m.fat));
      let k = Math.round(toNum(m.kcal,true)||0);
      if(!k) k = Math.round(4*p+4*c+9*f);
      return {id:uid(),name:String(m.name),kcal:k,protein:p,carbs:c,fat:f,source,time:nowHM()};
    });
    if(!out.length) throw new Error('La IA no devolvió alimentos');
    return out;

        ]

    ),

          React.createElement('div',{className:'meal-macros'},'P:',r1(m.protein),'g C:',r1(m.carbs),'g G:',r1(m.fat),'g'),

          onUpdateFrequent && React.createElement('button',{className:'icon-btn',title:'Guardar en frecuentes','aria-label':'Guardar en frecuentes',onClick:(e)=>{e.stopPropagation();saveAsFrequent(m);}},'⭐'),

function fmtTime(t){
  if(!t) return '';
  if(String(t).includes('T')){ const d=new Date(t); return isNaN(d)?'':d.toTimeString().slice(0,5); }
  return t;
}

function TabDia({data,update,date,setDate,notify}){
  const {block} = getCurrentBlock(data.plan, date);
  const day = data.days[date] || emptyDay();
  const type = day.typeOverride || getScheduleType(date);
  const routine = routineFor(day,date);
  const hasSimPerf = perfEntries(data).some(e=>e.dateISO===date && (e.type==='hyrox_sim'||e.type==='hyrox_race'));
  function saveSim(){
    update(prev=>{
      const d = prev.days[date]||{};
      if(!(d.hyroxSimMin>0)) return prev;
      const p = prev.performance||{hyrox:[],secondary:[]};
      if((p.hyrox||[]).some(e=>e.dateISO===date && e.type==='hyrox_sim')) return prev;
      const entry = {id:'p'+uid(),type:'hyrox_sim',durationMin:d.hyroxSimMin,hrAvg:null,hrMax:null,rpe:d.hyroxSimRpe||null,notes:'Desde checklist',segments:[],dateISO:date};
      return {...prev,performance:{...p,hyrox:[...(p.hyrox||[]),entry]}};
    });
    notify && notify('Simulación guardada en Rendimiento');
  }

  // Todas las escrituras parten del estado MÁS RECIENTE (evita perder cambios con respuestas lentas de la IA)
  function updateDay(patch){
    update(prev=>{
      const cur = (prev.days && prev.days[date]) || emptyDay();
      const p = typeof patch==='function' ? patch(cur) : patch;
      return {...prev,days:{...prev.days,[date]:{...cur,...p}}};
    });
  }
  const field = (key,fallback) => val => updateDay(cur=>({[key]: typeof val==='function' ? val(cur[key]||fallback) : val}));

  return React.createElement(Fragment,null,
    React.createElement(DaySelector,{date,onChange:setDate}),
    React.createElement('div',{className:'text-xs text-muted text-center mb-12'},
      type==='funcional'?'🏃 Clase Funcional Hyrox':
      type==='fuerza'?'🏋️ '+(routine?routine.name:'Fuerza'):
      type==='hyroxSim'?'🔥 Simulación Hyrox 60%':
      '😴 Descanso'
    ),
    React.createElement(ErrorBoundary,{name:'Checklist'},
      React.createElement(ChecklistCard,{day,date,type,routine,onUpdate:updateDay,hasSimPerf,onSaveSim:saveSim})
    ),
    type==='fuerza' && routine && React.createElement(ErrorBoundary,{name:'Rutina'},
      React.createElement(ExpandableRoutine,{routine,lifts:day.lifts||{},onUpdateLifts:field('lifts',{}),days:data.days||{},date})
    ),
    React.createElement(ErrorBoundary,{name:'Compensación'},
      React.createElement(CarryoverCard,{data,date,update})
    ),
    React.createElement(ErrorBoundary,{name:'Macros'},
      React.createElement(MacroSummaryCard,{meals:day.meals||[],targets:effectiveTargets(data,date),date})
    ),
    React.createElement(ErrorBoundary,{name:'Comidas'},
      React.createElement(MealsCard,{key:date,date,notify,meals:day.meals||[],onUpdate:field('meals',[]),apiKey:data.apiKey,frequent:data.frequentFoods,
        onUpdateFrequent:ff=>update(prev=>({...prev,frequentFoods: typeof ff==='function'?ff(prev.frequentFoods):ff}))})
    ),
    React.createElement(ErrorBoundary,{name:'Peso'},
      React.createElement(WeightCard,{key:date,weight:day.weight||{},onUpdate:field('weight',{}),apiKey:data.apiKey})
    ),
    React.createElement(ErrorBoundary,{name:'Supps'},
      React.createElement(SuppsCard,{supps:day.supps||{},onUpdate:field('supps',{})})
    ),
    React.createElement(ErrorBoundary,{name:'Nota'},
      React.createElement(NoteCard,{note:day.note,onChange:n=>updateDay({note:n})})
    )
  );
}

// Estructura (compatible con tu backup): data.performance = {hyrox:[], secondary:[]}
// entrada: {id,type,durationMin,hrAvg,hrMax,rpe,notes,segments,dateISO}
const PERF_TYPES = {
  hyrox_sim:{icon:'🔥',label:'Simulación Hyrox'},
  hyrox_race:{icon:'🏁',label:'Carrera Hyrox'},
  funcional:{icon:'🏃',label:'Clase Funcional'},
  fuerza:{icon:'🏋️',label:'Fuerza'},
  running:{icon:'👟',label:'Correr'},
  benchmark:{icon:'📊',label:'Benchmark'}
};

function perfEntries(data){
  const p = (data && data.performance) || {};
  const a = (Array.isArray(p.hyrox)?p.hyrox:[]);
  const b = (Array.isArray(p.secondary)?p.secondary:[]);
  return [...a,...b].sort((x,y)=>String(y.dateISO||'').localeCompare(String(x.dateISO||'')));
}

function fmtDur(min){
  if(min==null || isNaN(min)) return '–';
  const t = Math.round(min*60);
  const m = Math.floor(t/60), s = t%60;
  return m+' min'+(s?' '+s+' s':'');
}

function PerfForm({data,update}){
  const blank = ()=>({dateISO:todayStr(),type:'hyrox_sim',min:'',sec:'',hrAvg:'',hrMax:'',rpe:null,notes:'',distanceKm:'',kcal:''});
  const [form,setForm] = useState(blank);
  const [watchLoading,setWatchLoading] = useState(false);
  const [notice,setNotice] = useState('');
  const fileRef = useRef();

  const busy = useRef(false);
  const durationMin = (toNum(form.min)||0) + (toNum(form.sec)||0)/60;
  const validDate = /^\d{4}-\d{2}-\d{2}$/.test(form.dateISO||'');

  function save(){
    const entry = {
      id:'p'+uid(),
      type:form.type,
      durationMin: Math.round(durationMin*100)/100,
      hrAvg: form.hrAvg===''?null:toNum(form.hrAvg),
      hrMax: form.hrMax===''?null:toNum(form.hrMax),
      rpe: form.rpe,
      notes: form.notes||'',
      segments: [],
      dateISO: form.dateISO
    };
    if(!validDate || !(durationMin>0)) return;
    if(form.distanceKm!=='' && toNum(form.distanceKm)!=null) entry.distanceKm = toNum(form.distanceKm);
    if(form.kcal!=='' && toNum(form.kcal)!=null) entry.kcal = toNum(form.kcal);
    const isHyrox = form.type==='hyrox_sim'||form.type==='hyrox_race';
    update(prev=>{
      const perf = {hyrox:[...(prev.performance?.hyrox||[])],secondary:[...(prev.performance?.secondary||[])]};
      (isHyrox ? perf.hyrox : perf.secondary).push(entry);
      return {...prev,performance:perf};
    });
    setForm(blank());
    setNotice('✓ Registro guardado');
  }

  async function parseWatch(e){
    const files = Array.from(e.target.files||[]);
    if(fileRef.current) fileRef.current.value='';
    if(!files.length||!data.apiKey||busy.current) return;
    busy.current = true;
    setWatchLoading(true); setNotice('');
    const got = {}; const errs = [];
    for(const file of files){
      try{
        const {b64,mediaType} = await prepareImage(file);
        const resp = await callClaude(data.apiKey,[{
          role:'user',
          content:[
            {type:'image',source:{type:'base64',media_type:mediaType,data:b64}},
            {type:'text',text:'Esta es una captura de Apple Watch / app Fitness de un entrenamiento. Extrae SOLO lo que veas escrito: duración total del entrenamiento, distancia, calorías activas, frecuencia cardiaca promedio y máxima. No calcules ni adivines: si no aparece, usa null. Responde SOLO JSON: {"durationMin":number,"durationSec":number,"distanceKm":number,"kcal":number,"hrAvg":number,"hrMax":number}. durationMin son los minutos enteros (si ves 1:16:52 → 76) y durationSec los segundos restantes (52).'}
          ]
        }]);
        const j = extractJSON(resp);
        if(!j||typeof j!=='object') throw new Error('respuesta ilegible');
        const mm = toNum(j.durationMin), ss = toNum(j.durationSec);
        if(mm!=null && mm>=0 && mm<=600 && got.min===undefined) got.min = Math.floor(mm);
        if(ss!=null && ss>=0 && ss<60 && got.sec===undefined) got.sec = Math.round(ss);
        else if(mm!=null && mm%1 && got.sec===undefined) got.sec = Math.round((mm%1)*60);
        const hrA = toNum(j.hrAvg), hrM = toNum(j.hrMax), dk = toNum(j.distanceKm), kc = toNum(j.kcal,true);
        if(hrA!=null && hrA>=40 && hrA<=230 && got.hrAvg===undefined) got.hrAvg = Math.round(hrA);
        if(hrM!=null && hrM>=40 && hrM<=230 && got.hrMax===undefined) got.hrMax = Math.round(hrM);
        if(dk!=null && dk>0 && dk<=200 && got.distanceKm===undefined) got.distanceKm = dk;
        if(kc!=null && kc>0 && kc<=5000 && got.kcal===undefined) got.kcal = Math.round(kc);
      }catch(err){ errs.push(err.message); }
    }
    const labels = {min:'Min',sec:'Seg',hrAvg:'FC prom',hrMax:'FC máx',distanceKm:'Km',kcal:'Kcal'};
    const keys = Object.keys(got);
    if(keys.length) setForm(f=>({...f,...got}));
    setNotice(
      (keys.length ? '✓ Leí: '+keys.map(k=>labels[k]+' '+got[k]).join(', ')+'. ' : 'No pude leer valores. ')
      + (errs.length ? 'Error: '+errs[0] : 'Revisa y corrige antes de guardar.')
    );
    busy.current = false;
    setWatchLoading(false);
  }

  const num = (k,label,step)=>React.createElement('div',{className:'flex-1'},
    React.createElement('div',{className:'text-xs text-muted'},label),
    React.createElement('input',{type:'number',inputMode:'decimal',step:step||'any',value:form[k]===null?'':form[k],onChange:e=>setForm({...form,[k]:e.target.value})})
  );

  return React.createElement('div',{className:'card'},
    React.createElement('div',{className:'card-title'},'➕ Nuevo registro'),
    React.createElement('div',{className:'mb-8'},
      React.createElement('div',{className:'text-xs text-muted'},'Fecha'),
      React.createElement('input',{type:'date',value:form.dateISO,onChange:e=>setForm({...form,dateISO:e.target.value})})
    ),
    React.createElement('div',{className:'mb-8'},
      React.createElement('div',{className:'text-xs text-muted'},'Tipo'),
      React.createElement('select',{value:form.type,onChange:e=>setForm({...form,type:e.target.value})},
        Object.keys(PERF_TYPES).map(k=>React.createElement('option',{key:k,value:k},PERF_TYPES[k].label))
      )
    ),
    React.createElement('div',{className:'flex-row mb-8'},num('min','Min'),num('sec','Seg')),
    React.createElement('div',{className:'flex-row mb-8'},num('hrAvg','FC prom'),num('hrMax','FC máx')),
    React.createElement('div',{className:'flex-row mb-8'},num('distanceKm','Km (opc.)'),num('kcal','Kcal (opc.)')),
    React.createElement('div',{className:'mb-8'},
      React.createElement('div',{className:'text-xs text-muted mb-8'},'RPE'),
      React.createElement(RpeSelect,{value:form.rpe,onChange:v=>setForm({...form,rpe:v})})
    ),
    React.createElement('input',{ref:fileRef,type:'file',accept:'image/*',multiple:true,style:{display:'none'},onChange:parseWatch}),
    React.createElement('button',{className:'btn btn-secondary w-full mb-8',onClick:()=>fileRef.current?.click(),disabled:watchLoading||!data.apiKey},
      watchLoading?'Analizando...':'⌚ Foto Apple Watch (1 o varias)'

function SimpleChart({data:chartData,width,height,color,label,unit,yMin,yMax}){
  if(!chartData||!chartData.length) return React.createElement('div',{className:'empty-state text-sm'},'Sin datos para graficar');

  const vals = chartData.map(d=>d.v);
  const mn = yMin!==undefined?yMin:Math.min(...vals);
  const mx = yMax!==undefined?yMax:Math.max(...vals);
  const range = mx-mn || 1;
  const pad = 40;
  const w = width-pad*2;
  const h = height-pad*2;

  const pts = chartData.map((d,i)=>({
    x: pad + (chartData.length>1 ? i/(chartData.length-1)*w : w/2),
    y: pad + h - ((d.v-mn)/range)*h
  }));

  const path = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');

  // Y axis labels
  const yLabels = [mn,mn+range/2,mx].map(v=>({v:(Math.abs(mx)>=100?Math.round(v).toString():v.toFixed(1)),y:pad+h-((v-mn)/range)*h}));
  // X axis labels (first, mid, last)
  const xIdxs = chartData.length<=5 ? chartData.map((_,i)=>i) : [0,Math.floor(chartData.length/2),chartData.length-1];

  return React.createElement('div',{className:'chart-container'},
    React.createElement('div',{className:'text-xs text-muted mb-8'},label),
    React.createElement('svg',{viewBox:`0 0 ${width} ${height}`,preserveAspectRatio:'xMidYMid meet'},
      // Grid

        React.createElement('line',{key:'g'+i,x1:pad,x2:width-pad,y1:yl.y,y2:yl.y,stroke:'var(--border)',strokeWidth:0.5})

function sessionDone(data,dd){
  const day = data.days && data.days[dd];
  if(day && (day.funcionalDone||day.fuerzaDone||day.hyroxSimDone||day.correrDone)) return true;
  return perfEntries(data).some(e=>e.dateISO===dd);
}

// Sesiones planeadas vs. hechas entre dos fechas (no cuenta días antes del plan, ni hoy si aún no entrenas)
function adherenceRange(data,from,to){
  const today = todayStr();
  const start = (data.plan && data.plan.startDate) || from;
  let planned=0, done=0;
  for(let dd=from; dd<=to; dd=dateAdd(dd,1)){
    if(dd<start || dd>today) continue;
    const isDone = sessionDone(data,dd);
    if(dayType(data,dd)==='rest'){ continue; }
    if(dd===today && !isDone) continue;
    planned++;
    if(isDone) done++;
  }
  return {planned,done};
}

function WeeklyAdherence({data}){
  // Last 4 weeks (días con sesión planeada vs. con sesión registrada: check del día o registro en Rendimiento)
  const today = todayStr();
  const weeks = [];
  for(let w=0;w<4;w++){
    const weekStart = dateAdd(today, -((isoWeekday(today)-1) + w*7));
    const {planned,done} = adherenceRange(data,weekStart,dateAdd(weekStart,6));
    weeks.unshift({label:w===0?'Esta sem.':'S-'+w,planned,done});
  }

  return React.createElement('div',{className:'card'},
    React.createElement('div',{className:'card-title'},'📊 Adherencia semanal'),
    React.createElement('div',{style:{display:'flex',justifyContent:'space-around'}},

          w.planned ? React.createElement(ProgressRing,{pct:pct(w.done,w.planned),size:50,stroke:4,color:pct(w.done,w.planned)>=80?'var(--green)':'var(--orange)'})

          React.createElement('div',{className:'text-xs'},w.done,'/',w.planned)

    )
  );
}

function reviewLine(r){
  const date = r.closedAt || r.date || '';
  const wEnd = r.weightEnd!=null ? r.weightEnd : r.avgWeight;
  const wStart = r.weightStart;
  const delta = (r.weightDelta!=null) ? Number(r.weightDelta) : (wStart!=null && wEnd!=null ? Number(wEnd)-Number(wStart) : null);
  const parts = [];
  if(r.avgKcal!=null) parts.push('Prom: '+r.avgKcal+' kcal');
  if(wEnd!=null) parts.push('Peso: '+wEnd+' kg'+(delta!=null && !isNaN(delta) ? ' ('+(delta>0?'+':'')+delta.toFixed(1)+')' : ''));
  if(r.trendKgWeek!=null) parts.push('Tendencia: '+(r.trendKgWeek>0?'+':'')+r.trendKgWeek+' kg/sem');
  if(r.tdee!=null) parts.push('TDEE aprox.: '+r.tdee);
  if(r.adherence!=null) parts.push('Adherencia: '+r.adherence+'%');
  if(r.daysLogged!=null) parts.push(r.daysLogged+'/'+(r.totalDays!=null?r.totalDays:'?')+' días con comidas');
  return {date,text:parts.join(' · '),notes:r.notes||''};
}

// Campo numérico que se edita libremente y se guarda al salir (evita valores intermedios raros)
function NumField({value,onCommit,min}){
  const [txt,setTxt] = useState(value==null?'':String(value));
  useEffect(()=>{ setTxt(value==null?'':String(value)); },[value]);
  function commit(){
    const n = toNum(txt);
    if(n==null || n<(min||0)){ setTxt(value==null?'':String(value)); return; }
    if(n!==value) onCommit(Math.round(n));
  }
  function change(v){
    const t = v.replace(/[^0-9]/g,'');
    setTxt(t);
    const n = toNum(t);
    if(n!=null && n>=(min||0) && n!==value) onCommit(Math.round(n)); // se guarda al teclear (vacío no se guarda)
  }
  return React.createElement('input',{type:'text',inputMode:'numeric',value:txt,onChange:e=>change(e.target.value),onBlur:commit,onKeyDown:e=>{if(e.key==='Enter') e.target.blur();}});
}

    });
  }
  function toggleFlex(wd){
    commit(prev=>{
      const cur = Array.isArray(prev.plan.flexDays)?prev.plan.flexDays:[5,6];
      const next = cur.includes(wd) ? cur.filter(x=>x!==wd) : [...cur,wd].sort();
      return {...prev,plan:{...prev.plan,flexDays:next}};
    });
  }

  function applyReview(){
    const {block,blockIdx} = getCurrentBlock(data.plan, todayStr());
    if(!block) return;
    const existing = (data.reviews||[]).filter(r=>r.blockId===block.id);
    if(existing.length && !window.confirm('Ya hay '+existing.length+' revisión(es) de '+block.name+'. ¿Agregar una nueva con datos actualizados? (las anteriores se conservan)')) return;
    if(!existing.length && !window.confirm('¿Generar la revisión de '+block.name+' con los datos hasta ayer?')) return;
    let blockStart = data.plan.startDate;
    for(let i=0;i<blockIdx;i++) blockStart = dateAdd(blockStart, data.plan.blocks[i].days);
    const today = todayStr();

    // Solo días completos: hasta ayer
    const dayKeys = Object.keys(data.days).filter(d=>d>=blockStart && d<today).sort();
    const kcalOf = d=>data.days[d].meals.reduce((ss,m)=>ss+(Number(m.kcal)||0),0);
    // Días con registro completo: al menos 50% del objetivo (un día a medio registrar distorsiona el promedio)
    const daysWithMeals = dayKeys.filter(d=>(data.days[d]?.meals||[]).length>0 && kcalOf(d) >= 0.5*getTargetKcal(getCurrentBlock(data.plan,d).block,d));
    const avgKcal = daysWithMeals.length ? Math.round(daysWithMeals.reduce((s,d)=>s+kcalOf(d),0)/daysWithMeals.length) : null;

    // Peso: tendencia por regresión lineal sobre TODOS los pesajes (suaviza agua/variaciones diarias)
    const wDays = Object.keys(data.days).filter(d=>d>=blockStart && d<=today && data.days[d]?.weight?.kg).sort();
    let weightStart=null, weightEnd=null, tdee=null, trendKgWeek=null;
    if(wDays.length>=2){
      const t0 = new Date(wDays[0]+'T12:00:00').getTime();
      const X = wDays.map(d=>(new Date(d+'T12:00:00').getTime()-t0)/86400000);
      const Y = wDays.map(d=>Number(data.days[d].weight.kg));
      const n = X.length, mx = X.reduce((a,b)=>a+b,0)/n, my = Y.reduce((a,b)=>a+b,0)/n;
      const sxx = X.reduce((a,x)=>a+(x-mx)*(x-mx),0), sxy = X.reduce((a,x,k)=>a+(x-mx)*(Y[k]-my),0);
      const slope = sxx ? sxy/sxx : 0; // kg/día
      const span = X[n-1];
      weightStart = Math.round((my + slope*(0-mx))*100)/100;
      weightEnd = Math.round((my + slope*(span-mx))*100)/100;
      trendKgWeek = Math.round(slope*7*100)/100;
      // TDEE ≈ ingesta promedio − pendiente × 7700 kcal/kg. Requiere ≥10 pesajes en ≥10 días.
      if(avgKcal && n>=10 && span>=10) tdee = Math.round(avgKcal - slope*7700);

      alert('Listo: se restauraron tus datos anteriores.');
    }catch(e){ alert('No se pudo deshacer: '+e.message); }
  }
  const perfCount = perfEntries(data).length;
  const WD = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

            React.createElement('div',null,React.createElement('div',{className:'text-xs text-muted'},'Días'),React.createElement(NumField,{value:b.days,min:1,onCommit:v=>updateBlock(i,{days:v})}))
          )
        )
      )
    ),

    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'card-title'},'📊 Revisión de bloque'),
      React.createElement('button',{className:'btn btn-primary w-full',onClick:applyReview},'Generar revisión del bloque actual'),
      (data.reviews||[]).length>0 && React.createElement('div',{className:'mt-12'},
        React.createElement('div',{className:'text-xs text-muted mb-8'},'Revisiones anteriores:'),
        (data.reviews||[]).map((r,i)=>{
          const L = reviewLine(r);
          const bName = r.blockName || ((data.plan?.blocks||[]).find(b=>b.id===r.blockId)||{}).name || r.blockId || 'Bloque';
          return React.createElement('div',{key:r.id||('r'+i),className:'text-xs',style:{padding:'6px 0',borderBottom:'1px solid var(--border)',display:'flex',gap:6,alignItems:'flex-start'}},
            React.createElement('div',{className:'flex-1'},
              React.createElement('span',{className:'fw-bold'},bName),
              ' — ',L.date,' · ',L.text,
              L.notes && React.createElement('div',{className:'text-muted'},L.notes)
            ),
            React.createElement('button',{className:'icon-btn text-red','aria-label':'Borrar revisión',onClick:()=>deleteReview(r.id)},'✕')
          );
        })
      )
    ),

    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'card-title'},'💾 Datos'),
      React.createElement('div',{className:'text-xs text-muted mb-8'},'Versión: ',data.version,' · Días: ',Object.keys(data.days||{}).length,' · Comidas: ',
        Object.values(data.days||{}).reduce((s,d)=>s+(d.meals||[]).length,0),' · Frecuentes: ',(data.frequentFoods||[]).length
      ),
      React.createElement('div',{className:'text-xs text-muted'},'Revisiones: ',(data.reviews||[]).length,' · Rendimiento: ',perfCount),
      data.lastExportAt && React.createElement('div',{className:'text-xs text-muted',style:{marginTop:4}},'Último backup: ',fmtDate(localDate(data.lastExportAt))),
      hasPrev && React.createElement('button',{className:'btn btn-secondary w-full mt-12',onClick:undoRestore},'↩️ Deshacer la última restauración (',fmtDate(localDate(prevAt)),')'),
      React.createElement('div',{className:'text-xs text-muted',style:{marginTop:8}},'Usa 💾 (arriba) para respaldar y 📂 para restaurar. Al restaurar se guarda automáticamente una copia de lo que tenías.')
    )
  );
}

// ─── App Root ──────────────────────────────────────────────
function App(){
  const [data,setData] = useState(()=>loadData());
  const [tab,setTab] = useState(0);
  const [date,setDate] = useState(todayStr());
  const [toast,setToast] = useState('');
  const fileRef = useRef();
  const dataRef = useRef(data);
  dataRef.current = data;
  const seenToday = useRef(todayStr());

  // Días flex configurables (global leído por isFlexDay)
  FLEX_DAYS = Array.isArray(data.plan&&data.plan.flexDays) ? data.plan.flexDays : [5,6];

  // Única vía de escritura: parte siempre del estado más reciente y guarda de inmediato
  const update = useCallback(fn=>{
    setData(prev=>{
      const next = typeof fn==='function' ? fn(prev) : fn;
      if(!next || next===prev) return prev;
      saveData(next);
      return next;
    });
  },[]);

  useEffect(()=>{
    // Guardar la versión migrada al abrir
    if(!SKIP_INITIAL_SAVE) saveData(dataRef.current);
    if(LOAD_WARNING) setTimeout(()=>alert('⚠️ '+LOAD_WARNING),300);
    // Pedir a Safari almacenamiento persistente (reduce el riesgo de borrado automático)
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

    // Si otra pestaña/ventana guardó datos, o vuelves a la app, recarga lo guardado (evita que una pestaña vieja sobrescriba)
    function syncFromStorage(){
      if(!lastSaveOk) return; // si el último guardado falló, lo de pantalla es lo más nuevo: no lo pises
      const fresh = safeGet(STORAGE_KEY);
      if(!fresh) return;
      try{
        if(JSON.stringify(fresh)!==JSON.stringify(dataRef.current)) setData(normalizeData(fresh));
      }catch(e){}
    }
    function onVisible(){
      if(document.visibilityState!=='visible') return;
      syncFromStorage();
      // Si la app quedó abierta de un día para otro, pasa al nuevo "Hoy"
      const t = todayStr();
      if(t!==seenToday.current){
        const old = seenToday.current;
        seenToday.current = t;
        setDate(d=> d===old ? t : d);
      }
    }
    function onStorage(e){ if(e.key===STORAGE_KEY) syncFromStorage(); }
    document.addEventListener('visibilitychange',onVisible);
    window.addEventListener('focus',onVisible);
    window.addEventListener('storage',onStorage);
    return ()=>{
      document.removeEventListener('visibilitychange',onVisible);
      window.removeEventListener('focus',onVisible);
      window.removeEventListener('storage',onStorage);
    };
  },[]);

  function showToast(msg){
    setToast(msg);
    setTimeout(()=>setToast(''),2500);
  }

  function doBackup(){
    const stamp = new Date().toISOString();
    const exp = {...dataRef.current,lastExportAt:stamp};
    delete exp.apiKey; // la API key no viaja en el backup (al restaurar se conserva la del dispositivo)
    const json = JSON.stringify(exp,null,2);
    const name = 'hyroxtrack-'+todayStr()+'.json';
    const done = ()=>{ update(prev=>({...prev,lastExportAt:stamp})); showToast('Backup listo ✓'); };
    function download(){
      const blob = new Blob([json],{type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),120000);
      done();
    }
    try{
      let file = null;
      try{ file = new File([json],name,{type:'application/json'}); }catch(e){}
      if(file && navigator.canShare && navigator.share && navigator.canShare({files:[file]})){
        // iPhone: hoja de compartir → "Guardar en Archivos"
        navigator.share({files:[file],title:'Backup HyroxTrack'})
          .then(done)
          .catch(err=>{ if(err && err.name==='AbortError') showToast('Backup cancelado'); else alert('No se pudo compartir el backup ('+(err&&err.message||'error')+'). Intenta de nuevo.'); });
        return;
      }
      download();
    }catch(err){
      alert('No se pudo crear el backup: '+err.message);
    }
  }

  function doRestore(){
    fileRef.current?.click();
  }

  function handleRestore(e){
    const file = e.target.files?.[0];
    if(fileRef.current) fileRef.current.value='';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const imported = JSON.parse(reader.result);
        if(!imported||typeof imported!=='object'||Array.isArray(imported)) throw new Error('archivo inválido');
        if(!imported.days && !imported.plan) throw new Error('no parece un backup de HyroxTrack');
        const nDays = Object.keys(imported.days||{}).length;
        if(!window.confirm('¿Restaurar este backup ('+nDays+' días)? Reemplaza lo que hay en la app. Se guarda una copia de lo actual por seguridad.')) return;
        // Copia de seguridad de lo actual antes de sobrescribir
        try{ localStorage.setItem(STORAGE_KEY+'_prev', JSON.stringify(dataRef.current)); localStorage.setItem(STORAGE_KEY+'_prev_at', new Date().toISOString()); }catch(_){}
        // Conservar la API key actual si el backup no trae una
        if(dataRef.current.apiKey) imported.apiKey = dataRef.current.apiKey;
        const clean = normalizeData(imported);
        update(()=>clean);
        showToast('Datos restaurados ✓');
      }catch(err){
        alert('Error al restaurar: '+err.message);
      }
    };
    reader.onerror = ()=>alert('No se pudo leer el archivo');
    reader.readAsText(file);
  }

  const {block,blockIdx,dayInBlock} = getCurrentBlock(data.plan, date);

  return React.createElement('div',{className:'app'},
    React.createElement(Toast,{msg:toast}),
    React.createElement('input',{ref:fileRef,type:'file',accept:'.json,application/json',style:{display:'none'},onChange:handleRestore}),
    React.createElement(TopBar,{block,blockIdx,dayInBlock,onBackup:doBackup,onRestore:doRestore}),
    React.createElement('div',{className:'content'},
      React.createElement(BackupBanner,{lastExportAt:data.lastExportAt,onBackup:doBackup}),
      tab===0 && React.createElement(ErrorBoundary,{name:'TabDia'},React.createElement(TabDia,{data,update,date,setDate,notify:showToast})),
      tab===1 && React.createElement(ErrorBoundary,{name:'TabRendimiento'},React.createElement(TabRendimiento,{data,update})),
      tab===2 && React.createElement(ErrorBoundary,{name:'TabProgreso'},React.createElement(TabProgreso,{data})),
      tab===3 && React.createElement(ErrorBoundary,{name:'TabDatos'},React.createElement(TabDatos,{data,update}))
    ),
    React.createElement(Tabbar,{active:tab,onChange:setTab})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
<script>
(function(){
  var LIBS = [
    ['https://unpkg.com/react@18.3.1/umd/react.production.min.js','https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js'],
    ['https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js','https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js'],
    ['https://unpkg.com/@babel/standalone@7.29.9/babel.min.js','https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.9/babel.min.js']
  ];
  function showError(title, detail){
    document.getElementById('root').innerHTML =
      '<div style="padding:24px;font-family:-apple-system,sans-serif;color:#eee">' +
      '<h2 style="margin:0 0 8px">' + title + '</h2>' +
      '<p style="opacity:.8;font-size:14px">Tus datos están a salvo en este dispositivo.</p>' +
      '<button onclick="location.reload()" style="margin:12px 0;padding:10px 18px;border-radius:8px;border:0;background:#3b82f6;color:#fff;font-size:15px">Recargar</button>' +
      '<pre style="white-space:pre-wrap;font-size:11px;opacity:.6">' + String(detail||'').replace(/</g,'&lt;') + '</pre></div>';
  }
  function loadOne(urls, k, done){
    if(k >= urls.length){ showError('No se pudieron cargar las librerías', 'Revisa tu conexión a internet y recarga.'); return; }
    var s = document.createElement('script');
    s.src = urls[k];
    s.onload = done;
    s.onerror = function(){ loadOne(urls, k+1, done); };
    document.head.appendChild(s);
  }
  function start(){
    try {
      var src = document.getElementById('app-source').textContent;
      var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] });
      eval(out.code);
    } catch(e) {
      showError('Error de carga', e.message + '\n\n' + (e.stack||''));
      console.error(e);
    }
  }
  (function next(i){ if(i >= LIBS.length) return start(); loadOne(LIBS[i], 0, function(){ next(i+1); }); })(0);
})();
</script>
