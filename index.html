const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
   CONFIG / CALENDARIO DEL PLAN
============================================================ */
const START_DATE = new Date(2026, 6, 28);
const TOTAL_DAYS = 41;
const LS_DATA_KEY = "hyroxTrackerData";
const LS_KEY_KEY = "hyroxApiKey";
const DOW_LABELS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function fmtShort(date) { return `${date.getDate()} ${MONTHS[date.getMonth()]}`; }

function buildSchedule() {
  const days = [];
  for (let n = 1; n <= TOTAL_DAYS; n++) {
    const date = addDays(START_DATE, n - 1);
    const dow = date.getDay();
    let phase = 1;
    if (n >= 36 && n <= 40) phase = 3;
    else if (n >= 29 && n <= 35) phase = 2;
    else if (n <= 28) phase = 1;
    const isRaceDay = n === TOTAL_DAYS;
    const isRest = dow === 6 && !isRaceDay;
    const hyroxClass = !isRest && !isRaceDay;
    let pesas = false, correr = false, correrMin = null, pesasDay = null;
    if (hyroxClass) {
      if (phase === 1) {
        if (dow === 1) { pesas = true; pesasDay = "A"; }
        if (dow === 3) { pesas = true; pesasDay = "B"; }
        if (dow === 2 || dow === 4) { correr = true; const week = Math.ceil(n/7); correrMin = Math.min(22, 12 + (week-1)*3); }
      } else if (phase === 2) {
        if (dow === 1) { pesas = true; pesasDay = "full"; }
        if (dow === 2 || dow === 4) { correr = true; correrMin = 11; }
      }
    }
    const highIntensity = hyroxClass && (dow === 5 || dow === 0);
    days.push({ n, date, dow, phase, isRaceDay, isRest, hyroxClass, pesas, correr, correrMin, pesasDay, highIntensity });
  }
  return days;
}
const SCHEDULE = buildSchedule();

const MACRO_TABLE_F3 = [

  { kcal:2600, protein:170, carbs:300, fat:80 },

function getMacroTarget(sd) {
  if (!sd || sd.isRaceDay) return null;
  if (sd.phase === 1) return { kcal:2200, protein:175, fat:61, carbs:225 };
  if (sd.phase === 2) return { kcal:2490, protein:170, fat:63, carbs:285 };
  if (sd.phase === 3) return MACRO_TABLE_F3[sd.n-36] || MACRO_TABLE_F3[4];

}

function defaultData() { return { version:1, days:{}, frequentFoods:[], lastExportAt:null }; }
function todayPlanDay() {
  const now = new Date();
  const startMid = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((nowMid-startMid)/86400000)+1;
  if (diff<1) return 1;
  if (diff>TOTAL_DAYS) return TOTAL_DAYS;
  return diff;
}

/* ============================================================
   PERSISTENCIA — localStorage real (funciona en cualquier navegador)
============================================================ */
function loadLS(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function saveLS(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}
function storageAvailable() {

/* ============================================================
   LLAMADAS A CLAUDE (con tu propia API key, CORS directo)
============================================================ */
async function callClaude(apiKey, body) {
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    let msg = resp.status;
    try { const j = await resp.json(); msg = (j.error && j.error.message) || msg; } catch(e){}
    throw new Error(String(msg));
  }
  return resp.json();
}
function extractJSON(apiResponse) {
  const texts = (apiResponse.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const clean = texts.replace(/```json|```/g,"").trim();
  const start = clean.indexOf("{"); const end = clean.lastIndexOf("}");
  if (start===-1||end===-1) throw new Error("Sin JSON en la respuesta");
  return JSON.parse(clean.slice(start,end+1));
}
async function calcularMacrosIA(apiKey, desc) {
  const json = await callClaude(apiKey, {
    model: "claude-sonnet-5",
    max_tokens: 500,
    messages: [{ role:"user", content: `Eres nutriólogo. Estima los macros de esta comida. Responde SOLO un objeto JSON sin texto extra ni backticks: {"name":"...","kcal":0,"protein":0,"carbs":0,"fat":0}. Comida: ${desc}` }],
  });
  return extractJSON(json);
}
async function fileToJpegBase64(file, maxDim=1200, quality=0.85) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve,reject)=>{
      const image = new Image();
      image.onload = ()=>resolve(image);
      image.onerror = ()=>reject(new Error("No se pudo leer la imagen"));
      image.src = url;
    });
    let { width, height } = img;
    if (width>maxDim || height>maxDim) {
      const scale = maxDim/Math.max(width,height);
      width = Math.round(width*scale); height = Math.round(height*scale);
    }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    canvas.getContext("2d").drawImage(img,0,0,width,height);
    return canvas.toDataURL("image/jpeg", quality).split(",")[1];
  } finally { URL.revokeObjectURL(url); }
}
const EXTRACT_PROMPTS = {
  bascula: `Esta es una foto de una báscula de bioimpedancia o de su app (ej. RENPHO), mostrando composición corporal. Lee los valores visibles con cuidado. Responde SOLO un objeto JSON sin texto extra ni backticks: {"weight_kg":0,"bodyfat_pct":0,"muscle_kg":null,"visceral_fat":null,"water_pct":null}. Si algún dato no aparece, usa null. No inventes valores.`,
  watch: `Esta es una foto o captura del resumen de un entrenamiento (Apple Watch o app Fitness/Actividad/Salud). Lee los valores visibles con cuidado. Responde SOLO un objeto JSON sin texto extra ni backticks: {"tipo":"","duration_min":0,"hr_avg":null,"hr_max":null,"calories":null,"distance_km":null,"pace":null}. Si algún dato no aparece, usa null. No inventes valores.`,
  comida: `Eres nutriólogo. Esta es una foto de una comida o alimento real (no un empaque con etiqueta). Identifica qué es, estima el tamaño de la porción visible con cuidado (usa referencias de tamaño en la imagen: plato, mano, cubiertos) y calcula sus macros de la forma más precisa y realista posible según composición nutricional real de esos alimentos. Si hay varios elementos en el plato, súmalos en un solo total y descríbelos todos en "name". Responde SOLO un objeto JSON sin texto extra ni backticks: {"name":"...","kcal":0,"protein":0,"carbs":0,"fat":0}.`,
};
async function extraerFotoIA(apiKey, file, tipo) {
  const base64 = await fileToJpegBase64(file);
  const json = await callClaude(apiKey, {
    model: "claude-sonnet-5",
    max_tokens: 500,
    messages: [{ role:"user", content: [
      { type:"image", source: { type:"base64", media_type:"image/jpeg", data: base64 } },
      { type:"text", text: EXTRACT_PROMPTS[tipo] },
    ]}],
  });
  return extractJSON(json);
}

/* ============================================================
   MINI GRÁFICAS SVG (sin dependencias externas)
============================================================ */
function LineChartSVG({ data, color, height=140 }) {
  if (!data || data.length < 2) return <p className="dim small">Aún no hay suficientes datos.</p>;
  const width=320, pad=10;
  const xs=data.map(d=>d.x), ys=data.map(d=>d.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const spanX=(maxX-minX)||1, spanY=(maxY-minY)||1;
  const pt = d => {
    const px = pad + ((d.x-minX)/spanX)*(width-2*pad);
    const py = height-pad - ((d.y-minY)/spanY)*(height-2*pad);
    return [px,py];
  };
  const pts = data.map(d=>pt(d).join(",")).join(" ");
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2.5" />
      {data.map((d,i)=>{ const [px,py]=pt(d); return <circle key={i} cx={px} cy={py} r="3" fill={color} />; })}
    </svg>
  );
}
function BarCompareSVG({ data, height=160 }) {
  if (!data || data.length < 1) return <p className="dim small">Aún no hay suficientes datos.</p>;
  const width=320, pad=10;
  const maxV = Math.max(...data.flatMap(d=>[d.real, d.objetivo||0]), 1);
  const groupW = (width-2*pad)/data.length;
  const barW = Math.min(14, groupW/3);
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height}>
      {data.map((d,i)=>{
        const gx = pad + i*groupW + groupW/2;
        const hReal = (d.real/maxV)*(height-2*pad);
        const hObj = ((d.objetivo||0)/maxV)*(height-2*pad);
        return (<g key={i}>
          <rect x={gx-barW-2} y={height-pad-hReal} width={barW} height={hReal} fill="#FF4B26" rx="2" />
          <rect x={gx+2} y={height-pad-hObj} width={barW} height={hObj} fill="#3A3C44" rx="2" />
        </g>);
      })}
    </svg>
  );
}

  );
}

/* ============================================================
   APP PRINCIPAL
============================================================ */
function HyroxTracker() {
  const [loaded, setLoaded] = useState(false);
  const [storageOK, setStorageOK] = useState(true);
  const [data, setData] = useState(defaultData());
  const [apiKey, setApiKey] = useState("");
  const [activeTab, setActiveTab] = useState("dia");
  const [selectedDay, setSelectedDay] = useState(todayPlanDay());
  const [saveStatus, setSaveStatus] = useState("idle");
  const hasHydrated = useRef(false);
  const dayStripRef = useRef(null);

  useEffect(() => {
    const ok = storageAvailable();
    setStorageOK(ok);
    setData(loadLS(LS_DATA_KEY, defaultData()));
    setApiKey(loadLS(LS_KEY_KEY, ""));
    hasHydrated.current = true;
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!hasHydrated.current) return;
    const ok = saveLS(LS_DATA_KEY, data);
    setSaveStatus(ok ? "saved" : "error");
    if (ok) { const t = setTimeout(()=>setSaveStatus("idle"), 1500); return ()=>clearTimeout(t); }
  }, [data]);

  useEffect(() => { if (hasHydrated.current) saveLS(LS_KEY_KEY, apiKey); }, [apiKey]);

  const getDayRecord = useCallback((n) => data.days[String(n)] || emptyDayRecord(), [data.days]);
  const updateDay = useCallback((n, updater) => {
    setData(prev => {
      const key = String(n);
      const current = prev.days[key] || emptyDayRecord();
      return { ...prev, days: { ...prev.days, [key]: updater(current) } };
    });
  }, []);
  const registerFrequent = useCallback((meal) => {
    if (!meal || !meal.name || !String(meal.name).trim()) return;
    setData(prev => {
      const name = String(meal.name).trim();
      const list = [...prev.frequentFoods];
      const idx = list.findIndex(f => f.name.toLowerCase() === name.toLowerCase());
      const clean = { name, kcal:Number(meal.kcal)||0, protein:Number(meal.protein)||0, carbs:Number(meal.carbs)||0, fat:Number(meal.fat)||0 };
      if (idx>=0) list[idx] = { ...list[idx], ...clean, count:(list[idx].count||1)+1 };
      else list.push({ ...clean, count:1 });
      list.sort((a,b)=>(b.count||1)-(a.count||1));
      return { ...prev, frequentFoods: list.slice(0,20) };
    });
  }, []);
  const setFrequentFoods = useCallback((updater) => {
    setData(prev => ({ ...prev, frequentFoods: updater(prev.frequentFoods) }));
  }, []);

  const sd = SCHEDULE[selectedDay-1];
  const rec = getDayRecord(selectedDay);
  const daysToRace = Math.max(0, TOTAL_DAYS - todayPlanDay());

  useEffect(() => {
    if (dayStripRef.current) {
      const el = dayStripRef.current.querySelector(`[data-day="${selectedDay}"]`);
      if (el) el.scrollIntoView({ behavior:"smooth", inline:"center", block:"nearest" });
    }
  }, [selectedDay]);

  if (!loaded) {
    return <div className="app-root center-screen"><span className="spin">⏳</span><p className="dim">Cargando…</p></div>;
  }

  return (
    <div className="app-root">
      <header className="app-header">
        <div className="header-top">
          <div>
            <h1>Hyrox Acapulco</h1>
            <p className="dim small">D-{daysToRace} para la carrera · 6 sep 2026</p>
          </div>
          <SaveBadge status={saveStatus} storageOK={storageOK} />
        </div>
      </header>

      {!storageOK && (
        <div className="banner banner-danger">⚠️ <span>Tu navegador está bloqueando el almacenamiento local (¿modo privado?). Cambia a modo normal para no perder tu progreso.</span></div>
      )}
      {!apiKey && (
        <div className="banner banner-warn">🔑 <span>Agrega tu API key en la pestaña Datos para usar el cálculo de macros con IA y las fotos de báscula/Watch.</span></div>
      )}
      {(!data.lastExportAt || (Date.now()-data.lastExportAt)/86400000 > 3) && (
        <div className="banner banner-warn">💾 <span>No has hecho un respaldo en unos días. Ve a Datos → Exportar y guárdalo en Notas — toma 10 segundos.</span></div>
      )}

      <div className="day-strip" ref={dayStripRef}>
        {SCHEDULE.map(d => {
          const r = getDayRecord(d.n);
          const anyDone = r.done.hyrox || r.done.pesas || r.done.correr;
          return (
            <button key={d.n} data-day={d.n}
              className={"day-chip"+(d.n===selectedDay?" day-chip-active":"")+(d.isRest?" day-chip-rest":"")+(d.isRaceDay?" day-chip-race":"")}
              onClick={()=>setSelectedDay(d.n)}>
              <span className="day-chip-n mono">{d.n}</span>
              <span className="day-chip-dow">{DOW_LABELS[d.dow]}</span>
              {anyDone && <span className="day-chip-check">✓</span>}
            </button>
          );
        })}
      </div>

      <main className="app-main">
        {activeTab==="dia" && <DiaTab sd={sd} rec={rec} selectedDay={selectedDay} setSelectedDay={setSelectedDay} updateDay={updateDay} registerFrequent={registerFrequent} frequentFoods={data.frequentFoods} apiKey={apiKey} />}
        {activeTab==="rendimiento" && <RendimientoTab sd={sd} rec={rec} selectedDay={selectedDay} updateDay={updateDay} allDays={data.days} apiKey={apiKey} />}
        {activeTab==="progreso" && <ProgresoTab allDays={data.days} />}
        {activeTab==="datos" && <DatosTab data={data} setData={setData} apiKey={apiKey} setApiKey={setApiKey} setFrequentFoods={setFrequentFoods} />}
      </main>

      <nav className="bottom-nav">
        <NavBtn ico="📅" label="Día" active={activeTab==="dia"} onClick={()=>setActiveTab("dia")} />
        <NavBtn ico="🏆" label="Rendimiento" active={activeTab==="rendimiento"} onClick={()=>setActiveTab("rendimiento")} />
        <NavBtn ico="⚖️" label="Progreso" active={activeTab==="progreso"} onClick={()=>setActiveTab("progreso")} />
        <NavBtn ico="⚙️" label="Datos" active={activeTab==="datos"} onClick={()=>setActiveTab("datos")} />
      </nav>
    </div>
  );
}
function NavBtn({ ico, label, active, onClick }) {
  return <button className={"nav-btn"+(active?" nav-btn-active":"")} onClick={onClick}><span className="nav-ico">{ico}</span><span>{label}</span></button>;
}

/* ============================================================
   TAB: DÍA A DÍA
============================================================ */
function DiaTab({ sd, rec, selectedDay, setSelectedDay, updateDay, registerFrequent, frequentFoods, apiKey }) {
  const target = getMacroTarget(sd);
  const totals = useMemo(()=>rec.meals.reduce((acc,m)=>({kcal:acc.kcal+(m.kcal||0),protein:acc.protein+(m.protein||0),carbs:acc.carbs+(m.carbs||0),fat:acc.fat+(m.fat||0)}),{kcal:0,protein:0,carbs:0,fat:0}), [rec.meals]);
  const [customOpen, setCustomOpen] = useState(false);
  const [aiOpen, setAiOpen] = useState(false);
  const [photoMealOpen, setPhotoMealOpen] = useState(false);
  const [scalePhotoOpen, setScalePhotoOpen] = useState(false);

  const toggleDone = (type) => updateDay(selectedDay, d=>({ ...d, done:{ ...d.done, [type]: !d.done[type] } }));
  const setRpe = (type, v) => updateDay(selectedDay, d=>({ ...d, rpe:{ ...d.rpe, [type]: v } }));
  const addMeal = (meal) => { updateDay(selectedDay, d=>({ ...d, meals:[...d.meals, { id: Date.now()+Math.random(), ...meal }] })); registerFrequent(meal); };
  const removeMeal = (id) => updateDay(selectedDay, d=>({ ...d, meals: d.meals.filter(m=>m.id!==id) }));
  const setBodycheck = (field, val) => updateDay(selectedDay, d=>({ ...d, bodycheck:{ ...d.bodycheck, [field]: val } }));
  const applyScalePhoto = (r) => {
    updateDay(selectedDay, d => ({ ...d, bodycheck: {
      weight: r.weight_kg!=null ? r.weight_kg : d.bodycheck.weight,
      bodyfat: r.bodyfat_pct!=null ? r.bodyfat_pct : d.bodycheck.bodyfat,
      extra: [
        r.muscle_kg!=null?`Músculo: ${r.muscle_kg}kg`:null,
        r.visceral_fat!=null?`Grasa visceral: ${r.visceral_fat}`:null,
        r.water_pct!=null?`Agua: ${r.water_pct}%`:null,
      ].filter(Boolean).join(" · "),
    }}));
    setScalePhotoOpen(false);
  };

  return (
    <div className="tab-pad">
      <div className="day-title-row">
        <button className="icon-btn" onClick={()=>setSelectedDay(Math.max(1,selectedDay-1))}>←</button>
        <div className="center">
          <div className="day-title">Día {selectedDay} · {fmtShort(sd.date)}</div>
          <div className="dim small">{phaseLabel(sd.phase, sd.isRaceDay)}{sd.isRest?" · Descanso":""}</div>
        </div>
        <button className="icon-btn" onClick={()=>setSelectedDay(Math.min(TOTAL_DAYS,selectedDay+1))}>→</button>
      </div>

      {sd.isRaceDay && <div className="card card-accent"><div className="card-title">🏆 Día de carrera</div><p className="small">Sin macro fijo — sigue el protocolo pre/durante/post. Registra tus tiempos reales en Rendimiento en cuanto puedas.</p></div>}
      {sd.isRest && !sd.isRaceDay && <div className="card"><p className="small dim">Descanso. Aprovecha para dormir bien.</p></div>}

      {!sd.isRest && (
        <div className="card">
          <div className="card-title">Entrenamiento</div>
          {sd.hyroxClass && <TrainRow ico="🏃" label={sd.highIntensity?"Hyrox/HIIT (con carrera)":"Hyrox/HIIT"} done={rec.done.hyrox} onToggle={()=>toggleDone("hyrox")} rpe={rec.rpe.hyrox} onRpe={v=>setRpe("hyrox",v)} />}
          {sd.pesas && <TrainRow ico="🏋️" label="Pesas" done={rec.done.pesas} onToggle={()=>toggleDone("pesas")} rpe={rec.rpe.pesas} onRpe={v=>setRpe("pesas",v)} routine={ROUTINES[sd.pesasDay]} />}
          {sd.correr && <TrainRow ico="🏃" label={`Correr Z2 (${sd.correrMin} min)`} done={rec.done.correr} onToggle={()=>toggleDone("correr")} rpe={rec.rpe.correr} onRpe={v=>setRpe("correr",v)} routine={{ title:"Protocolo Zona 2", items: CORRER_PROTOCOL }} />}
        </div>
      )}

      {target && (
        <div className="card">
          <div className="card-title">Macros de hoy</div>
          <MacroBar label="Kcal" actual={totals.kcal} target={target.kcal} unit="" color="var(--accent)" />
          <MacroBar label="Proteína" actual={totals.protein} target={target.protein} unit="g" color="var(--accent-3)" />
          <MacroBar label="Carbos" actual={totals.carbs} target={target.carbs} unit="g" color="var(--accent-2)" />
          <MacroBar label="Grasa" actual={totals.fat} target={target.fat} unit="g" color="var(--warn)" />
        </div>
      )}

      <div className="card">
        <div className="card-title">Comidas</div>
        {rec.meals.length===0 && <p className="dim small">Aún no registras comidas hoy.</p>}
        {rec.meals.map(m=>(
          <div key={m.id} className="meal-row">
            <div><div className="meal-name">{m.name}</div><div className="dim small mono">{Math.round(m.kcal)} kcal · P{Math.round(m.protein)} C{Math.round(m.carbs)} G{Math.round(m.fat)}</div></div>
            <button className="icon-btn-danger" onClick={()=>removeMeal(m.id)}>✕</button>
          </div>
        ))}
        {frequentFoods.length>0 && (
          <div className="chip-row">
            {frequentFoods.slice(0,8).map((f,i)=>(<button key={i} className="chip" onClick={()=>addMeal({name:f.name,kcal:f.kcal,protein:f.protein,carbs:f.carbs,fat:f.fat})}>{f.name}</button>))}
          </div>
        )}
        <div className="btn-row">
          <button className="btn btn-secondary" onClick={()=>setCustomOpen(v=>!v)}>➕ Manual</button>
          <button className="btn btn-primary" onClick={()=>setAiOpen(v=>!v)}>✨ Texto con IA</button>
        </div>
        <div className="btn-row">
          <button className="btn btn-primary" onClick={()=>setPhotoMealOpen(v=>!v)}>📷 Foto del platillo (IA)</button>
        </div>
        {customOpen && <CustomMealForm onAdd={m=>{addMeal(m); setCustomOpen(false);}} onClose={()=>setCustomOpen(false)} />}
        {aiOpen && <AiMealForm apiKey={apiKey} onAdd={m=>{addMeal(m); setAiOpen(false);}} onClose={()=>setAiOpen(false)} />}
        {photoMealOpen && <AiPhotoMealForm apiKey={apiKey} onAdd={m=>{addMeal(m); setPhotoMealOpen(false);}} onClose={()=>setPhotoMealOpen(false)} />}
      </div>

      <div className="card">
        <div className="card-title">⚖️ Peso corporal (opcional)</div>
        {!scalePhotoOpen
          ? <button className="btn btn-primary" style={{marginBottom:10}} onClick={()=>setScalePhotoOpen(true)}>📷 Foto de la báscula</button>
          : <div style={{marginBottom:10}}><PhotoExtractForm apiKey={apiKey} tipo="bascula" onApply={applyScalePhoto} onClose={()=>setScalePhotoOpen(false)} /></div>}
        <div className="two-col">
          <div><label className="dim small">Peso (kg)</label><input className="input" type="number" inputMode="decimal" placeholder="—" value={rec.bodycheck.weight ?? ""} onChange={e=>setBodycheck("weight", e.target.value===""?null:parseFloat(e.target.value))} /></div>
          <div><label className="dim small">% Grasa</label><input className="input" type="number" inputMode="decimal" placeholder="—" value={rec.bodycheck.bodyfat ?? ""} onChange={e=>setBodycheck("bodyfat", e.target.value===""?null:parseFloat(e.target.value))} /></div>
        </div>
        {rec.bodycheck.extra && <p className="dim small">{rec.bodycheck.extra}</p>}
      </div>
    </div>
  );
}
function TrainRow({ ico, label, done, onToggle, rpe, onRpe, routine }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="train-row">
      <button className={"train-toggle"+(done?" train-toggle-done":"")} onClick={onToggle}>
        <span>{ico}</span><span>{label}</span><span className="train-check">{done?"✓":""}</span>
      </button>
      {routine && (
        <button className="routine-toggle" onClick={()=>setOpen(o=>!o)}>{open?"▾ Ocultar rutina":"▸ Ver qué hacer"}</button>
      )}
      {open && routine && (
        <div className="routine-box">
          <div className="routine-title">{routine.title}</div>
          <ul className="routine-list">{routine.items.map((it,i)=><li key={i}>{it}</li>)}</ul>
        </div>
      )}
      {done && <div className="rpe-wrap"><span className="dim small">RPE</span><RPEPicker value={rpe} onChange={onRpe} /></div>}
    </div>
  );
}
function CustomMealForm({ onAdd, onClose }) {
  const [f, setF] = useState({ name:"", kcal:"", protein:"", carbs:"", fat:"" });
  const valid = f.name.trim() && f.kcal !== "";
  return (
    <div className="inline-form">
      <input className="input" placeholder="Nombre del alimento" value={f.name} onChange={e=>setF({...f,name:e.target.value})} />
      <div className="four-col">
        <input className="input" type="number" inputMode="decimal" placeholder="Kcal" value={f.kcal} onChange={e=>setF({...f,kcal:e.target.value})} />
        <input className="input" type="number" inputMode="decimal" placeholder="Prot" value={f.protein} onChange={e=>setF({...f,protein:e.target.value})} />
        <input className="input" type="number" inputMode="decimal" placeholder="Carb" value={f.carbs} onChange={e=>setF({...f,carbs:e.target.value})} />
        <input className="input" type="number" inputMode="decimal" placeholder="Grasa" value={f.fat} onChange={e=>setF({...f,fat:e.target.value})} />
      </div>
      <div className="btn-row">
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!valid} onClick={()=>onAdd({name:f.name.trim(), kcal:parseFloat(f.kcal)||0, protein:parseFloat(f.protein)||0, carbs:parseFloat(f.carbs)||0, fat:parseFloat(f.fat)||0})}>Agregar</button>
      </div>
    </div>
  );
}
function AiMealForm({ apiKey, onAdd, onClose }) {
  const [desc, setDesc] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(null);
  const calcular = async () => {
    if (!desc.trim()) return;
    if (!apiKey) { setError("Agrega tu API key en la pestaña Datos primero."); return; }
    setLoading(true); setError(""); setResult(null);
    try { setResult(await calcularMacrosIA(apiKey, desc)); }
    catch(e) { setError("No se pudo calcular: " + e.message); }
    finally { setLoading(false); }
  };
  return (
    <div className="inline-form">
      <input className="input" placeholder="Ej. 2 huevos revueltos con 1 tortilla" value={desc} onChange={e=>setDesc(e.target.value)} />
      {!result && (
        <div className="btn-row">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" disabled={loading || !desc.trim()} onClick={calcular}>{loading?"Calculando…":"✨ Calcular"}</button>
        </div>
      )}
      {error && <p className="small" style={{color:"var(--danger)"}}>{error}</p>}
      {result && (
        <div className="ai-result">
          <div className="meal-name">{result.name}</div>
          <div className="dim small mono">{Math.round(result.kcal)} kcal · P{Math.round(result.protein)} C{Math.round(result.carbs)} G{Math.round(result.fat)}</div>
          <div className="btn-row"><button className="btn btn-ghost" onClick={onClose}>Descartar</button><button className="btn btn-primary" onClick={()=>onAdd(result)}>Agregar</button></div>
        </div>
      )}
    </div>
  );
}

   TAB: RENDIMIENTO
============================================================ */
function PerformanceSection({ title, ico, apiKey, perf, setPerf, photoTipo, extraHint }) {
  const [photoOpen, setPhotoOpen] = useState(false);
  const addSegment = () => setPerf({ ...perf, segments: [...perf.segments, { id: Date.now(), label:"", value:"" }] });
  const updateSegment = (id, field, val) => setPerf({ ...perf, segments: perf.segments.map(s=>s.id===id?{...s,[field]:val}:s) });
  const removeSegment = (id) => setPerf({ ...perf, segments: perf.segments.filter(s=>s.id!==id) });
  const applyPhoto = (r) => {
    const extras = [
      r.tipo?`Tipo: ${r.tipo}`:null,
      r.distance_km!=null?`Distancia: ${r.distance_km}km`:null,
      r.pace?`Ritmo: ${r.pace}`:null,
      r.calories!=null?`Calorías: ${r.calories}`:null,
    ].filter(Boolean);
    setPerf({
      ...perf,
      durationMin: r.duration_min!=null ? r.duration_min : perf.durationMin,
      hrAvg: r.hr_avg!=null ? r.hr_avg : perf.hrAvg,
      hrMax: r.hr_max!=null ? r.hr_max : perf.hrMax,
      segments: extras.length ? [...perf.segments, { id: Date.now(), label:"Apple Watch", value: extras.join(" · ") }] : perf.segments,
    });
    setPhotoOpen(false);
  };
  return (
    <div className="card">
      <div className="card-title">{ico} {title}</div>
      {extraHint && <p className="dim small">{extraHint}</p>}
      {!photoOpen
        ? <button className="btn btn-primary" style={{marginBottom:10}} onClick={()=>setPhotoOpen(true)}>📷 Foto del Apple Watch</button>
        : <div style={{marginBottom:10}}><PhotoExtractForm apiKey={apiKey} tipo={photoTipo} onApply={applyPhoto} onClose={()=>setPhotoOpen(false)} /></div>}
      <div className="two-col">
        <div><label className="dim small">Duración total (min)</label><input className="input" type="number" inputMode="decimal" placeholder="—" value={perf.durationMin ?? ""} onChange={e=>setPerf({...perf, durationMin: e.target.value===""?null:parseFloat(e.target.value)})} /></div>
        <div><label className="dim small">RPE sesión</label><input className="input" type="number" min="1" max="10" placeholder="—" value={perf.rpeSession ?? ""} onChange={e=>setPerf({...perf, rpeSession: e.target.value===""?null:parseInt(e.target.value)})} /></div>
      </div>
      <div className="two-col">
        <div><label className="dim small">❤️ FC promedio</label><input className="input" type="number" placeholder="—" value={perf.hrAvg ?? ""} onChange={e=>setPerf({...perf, hrAvg: e.target.value===""?null:parseInt(e.target.value)})} /></div>
        <div><label className="dim small">❤️ FC máxima</label><input className="input" type="number" placeholder="—" value={perf.hrMax ?? ""} onChange={e=>setPerf({...perf, hrMax: e.target.value===""?null:parseInt(e.target.value)})} /></div>
      </div>
      <div className="card-title" style={{marginTop:12}}>Detalle (estaciones, splits o pesos)</div>
      {perf.segments.map(s=>(
        <div key={s.id} className="segment-row">
          <input className="input" placeholder="Ej. SkiErg / Km 3 / Sentadilla" value={s.label} onChange={e=>updateSegment(s.id,"label",e.target.value)} />
          <input className="input segment-value" placeholder="1:32 / 80kg x8" value={s.value} onChange={e=>updateSegment(s.id,"value",e.target.value)} />
          <button className="icon-btn-danger" onClick={()=>removeSegment(s.id)}>✕</button>
        </div>
      ))}
      <button className="btn btn-secondary" onClick={addSegment}>➕ Agregar línea</button>
      <label className="dim small" style={{marginTop:10,display:"block"}}>Notas</label>
      <textarea className="input" rows="2" placeholder="Cómo te sentiste, condiciones, etc." value={perf.notes} onChange={e=>setPerf({...perf, notes: e.target.value})} />
    </div>
  );
}

function RendimientoTab({ sd, rec, selectedDay, updateDay, allDays, apiKey }) {
  const perf = rec.performance;
  const setHyroxPerf = (val) => updateDay(selectedDay, d=>({ ...d, performance:{ ...d.performance, hyrox: val } }));
  const setSecondaryPerf = (val) => updateDay(selectedDay, d=>({ ...d, performance:{ ...d.performance, secondary: val } }));

  const secondaryLabel = sd.pesas ? `Pesas (${ROUTINES[sd.pesasDay] ? ROUTINES[sd.pesasDay].title : ""})` : sd.correr ? `Running Z2 (${sd.correrMin} min)` : "Running / Pesas";
  const hasSecondary = sd.pesas || sd.correr;

  const history = useMemo(()=>Object.entries(allDays)
    .filter(([,d])=>d.performance && ((d.performance.hyrox && (d.performance.hyrox.durationMin || (d.performance.hyrox.segments||[]).length)) || (d.performance.secondary && (d.performance.secondary.durationMin || (d.performance.secondary.segments||[]).length))))
    .map(([n,d])=>({ n:parseInt(n), hyrox:d.performance.hyrox, secondary:d.performance.secondary }))
    .sort((a,b)=>b.n-a.n), [allDays]);

  return (
    <div className="tab-pad">
      <div className="day-title" style={{textAlign:"center"}}>Día {selectedDay} · {fmtShort(sd.date)}</div>

      <PerformanceSection title="Hyrox" ico="🏆" apiKey={apiKey} perf={perf.hyrox} setPerf={setHyroxPerf} photoTipo="watch"
        extraHint="Duración/FC de la clase o simulación de Hyrox. Sube el screenshot del Watch y se llena solo." />

      {hasSecondary ? (
        <PerformanceSection title={secondaryLabel} ico={sd.pesas?"🏋️":"🏃"} apiKey={apiKey} perf={perf.secondary} setPerf={setSecondaryPerf} photoTipo="watch"
          extraHint={sd.pesas ? "Anota tus ejercicios en 'Detalle' (ej. Press banca: 60kg x8x4)." : "Distancia, ritmo y FC de tu carrera Z2."} />
      ) : (
        <div className="card"><p className="dim small">No hay sesión de Running/Pesas programada hoy.</p></div>
      )}

      <div className="card">
        <div className="card-title">Historial</div>
        {history.length===0 && <p className="dim small">Aún no hay sesiones registradas con detalle.</p>}
        {history.map(h=>(
          <div key={h.n} className="history-row">
            <div className="mono day-title" style={{fontSize:14}}>Día {h.n}</div>
            {h.hyrox && (h.hyrox.durationMin || h.hyrox.hrAvg) && (
              <div className="dim small">🏆 {h.hyrox.durationMin?`${h.hyrox.durationMin} min`:""}{h.hyrox.hrAvg?` · FC ${h.hyrox.hrAvg}`:""}{h.hyrox.rpeSession?` · RPE ${h.hyrox.rpeSession}`:""}</div>
            )}
            {h.secondary && (h.secondary.durationMin || h.secondary.hrAvg) && (
              <div className="dim small">🏋️🏃 {h.secondary.durationMin?`${h.secondary.durationMin} min`:""}{h.secondary.hrAvg?` · FC ${h.secondary.hrAvg}`:""}{h.secondary.rpeSession?` · RPE ${h.secondary.rpeSession}`:""}</div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   TAB: PROGRESO
============================================================ */
function ProgresoTab({ allDays }) {
  const rows = useMemo(()=>SCHEDULE.map(sd=>({ sd, d: allDays[String(sd.n)] || null })), [allDays]);
  const weightSeries = rows.filter(r=>r.d && r.d.bodycheck && r.d.bodycheck.weight!=null).map(r=>({x:r.sd.n,y:r.d.bodycheck.weight}));
  const fatSeries = rows.filter(r=>r.d && r.d.bodycheck && r.d.bodycheck.bodyfat!=null).map(r=>({x:r.sd.n,y:r.d.bodycheck.bodyfat}));
  const hrSeries = rows.filter(r=>r.d && r.d.performance && ((r.d.performance.hyrox && r.d.performance.hyrox.hrAvg!=null) || (r.d.performance.secondary && r.d.performance.secondary.hrAvg!=null)))
    .map(r=>({x:r.sd.n, y:(r.d.performance.hyrox && r.d.performance.hyrox.hrAvg!=null) ? r.d.performance.hyrox.hrAvg : r.d.performance.secondary.hrAvg}));
  const kcalSeries = rows.filter(r=>r.d && r.d.meals && r.d.meals.length>0).map(r=>{
    const target = getMacroTarget(r.sd);
    const actual = r.d.meals.reduce((a,m)=>a+(m.kcal||0),0);
    return { x:r.sd.n, real:Math.round(actual), objetivo: target?target.kcal:null };
  }).slice(-14);
  const elapsed = rows.filter(r=>r.sd.n<=todayPlanDay());
  const trained = elapsed.filter(r=>r.d && (r.d.done.hyrox||r.d.done.pesas||r.d.done.correr) && !r.sd.isRest);
  const trainableDays = elapsed.filter(r=>!r.sd.isRest).length;
  const adherence = trainableDays ? Math.round((trained.length/trainableDays)*100) : 0;
  const rpeVals = elapsed.flatMap(r=>r.d?[r.d.rpe.hyrox,r.d.rpe.pesas,r.d.rpe.correr]:[]).filter(v=>v!=null);
  const avgRpe = rpeVals.length ? (rpeVals.reduce((a,b)=>a+b,0)/rpeVals.length).toFixed(1) : "—";

  return (
    <div className="tab-pad">
      <div className="stat-grid">
        <StatCard label="Asistencia" value={`${adherence}%`} />
        <StatCard label="RPE promedio" value={avgRpe} />
        <StatCard label="Registros de peso" value={weightSeries.length} />
        <StatCard label="Días transcurridos" value={`${Math.min(todayPlanDay(),TOTAL_DAYS)}/${TOTAL_DAYS}`} />
      </div>
      <ChartCard title="Peso corporal (kg)"><LineChartSVG data={weightSeries} color="#FF4B26" /></ChartCard>
      <ChartCard title="% Grasa corporal"><LineChartSVG data={fatSeries} color="#7CD957" /></ChartCard>
      <ChartCard title="Kcal reales vs objetivo (últimos días)"><BarCompareSVG data={kcalSeries} /></ChartCard>
      <ChartCard title="FC promedio de entrenamiento"><LineChartSVG data={hrSeries} color="#4EA1FF" /></ChartCard>
    </div>
  );
}
function StatCard({ label, value }) { return <div className="stat-card"><div className="stat-value mono">{value}</div><div className="dim small">{label}</div></div>; }
function ChartCard({ title, children }) { return <div className="card"><div className="card-title">{title}</div>{children}</div>; }

/* ============================================================
   TAB: DATOS (ajustes + respaldo)
============================================================ */
function DatosTab({ data, setData, apiKey, setApiKey, setFrequentFoods }) {
  const [showKey, setShowKey] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const [resetArmed, setResetArmed] = useState(false);
  const [newFood, setNewFood] = useState({ name:"", kcal:"", protein:"", carbs:"", fat:"" });
  const exportRef = useRef(null);
  const exportText = useMemo(()=>JSON.stringify(data), [data]);

  const addFrequentFood = () => {
    if (!newFood.name.trim() || newFood.kcal==="") return;
    setFrequentFoods(list => [...list, {
      name:newFood.name.trim(), kcal:parseFloat(newFood.kcal)||0, protein:parseFloat(newFood.protein)||0,
      carbs:parseFloat(newFood.carbs)||0, fat:parseFloat(newFood.fat)||0, count:1,
    }]);
    setNewFood({ name:"", kcal:"", protein:"", carbs:"", fat:"" });
  };
  const removeFrequentFood = (name) => setFrequentFoods(list => list.filter(f=>f.name!==name));

  const doImport = () => {
    try {
      const parsed = JSON.parse(importText);
      if (!parsed || typeof parsed !== "object" || !parsed.days) throw new Error("formato");
      setData(parsed);
      setImportMsg("✓ Restaurado correctamente.");
      setImportText("");
    } catch(e) { setImportMsg("No reconozco ese texto — revisa que sea justo lo que copiaste de Exportar."); }
  };
  const doReset = () => {
    if (!resetArmed) { setResetArmed(true); setTimeout(()=>setResetArmed(false),5000); return; }
    setData(defaultData());
    setResetArmed(false);
  };

  return (
    <div className="tab-pad">
      <div className="card">
        <div className="card-title">🍽️ Alimentos frecuentes</div>
        <p className="dim small">Se agregan solos cuando registras una comida (manual o con IA). También puedes cargarlos aquí directamente para no depender de la IA cada vez.</p>
        {data.frequentFoods.length===0 && <p className="dim small">Aún no tienes ninguno guardado.</p>}
        {data.frequentFoods.map(f=>(
          <div key={f.name} className="meal-row">
            <div><div className="meal-name">{f.name}</div><div className="dim small mono">{Math.round(f.kcal)} kcal · P{Math.round(f.protein)} C{Math.round(f.carbs)} G{Math.round(f.fat)}</div></div>
            <button className="icon-btn-danger" onClick={()=>removeFrequentFood(f.name)}>✕</button>
          </div>
        ))}
        <div className="inline-form">
          <input className="input" placeholder="Nombre del alimento" value={newFood.name} onChange={e=>setNewFood({...newFood,name:e.target.value})} />
          <div className="four-col">
            <input className="input" type="number" inputMode="decimal" placeholder="Kcal" value={newFood.kcal} onChange={e=>setNewFood({...newFood,kcal:e.target.value})} />
            <input className="input" type="number" inputMode="decimal" placeholder="Prot" value={newFood.protein} onChange={e=>setNewFood({...newFood,protein:e.target.value})} />
            <input className="input" type="number" inputMode="decimal" placeholder="Carb" value={newFood.carbs} onChange={e=>setNewFood({...newFood,carbs:e.target.value})} />
            <input className="input" type="number" inputMode="decimal" placeholder="Grasa" value={newFood.fat} onChange={e=>setNewFood({...newFood,fat:e.target.value})} />
          </div>
          <button className="btn btn-primary" onClick={addFrequentFood}>➕ Agregar a frecuentes</button>
        </div>
      </div>

      <div className="card">
        <div className="card-title">🔑 Tu API key de Anthropic</div>
        <p className="dim small">Necesaria solo para "Calcular con IA" y las fotos de báscula/Watch. Créala gratis en <b>console.anthropic.com</b> → API Keys. El uso tiene costo mínimo (fracciones de centavo por consulta), cargado a esa cuenta — no a tu suscripción de Claude.</p>
        <div style={{display:"flex", gap:8}}>
          <input className="input" type={showKey?"text":"password"} placeholder="sk-ant-..." value={apiKey} onChange={e=>setApiKey(e.target.value)} />
          <button className="btn btn-secondary" style={{flex:"0 0 auto"}} onClick={()=>setShowKey(s=>!s)}>{showKey?"Ocultar":"Ver"}</button>
        </div>
      </div>

      <div className="card">
        <div className="card-title">⬇️ Exportar respaldo</div>
        <p className="dim small">Genera un bloque de texto con todo tu progreso. Pégalo en Notas o mándatelo por WhatsApp como respaldo.</p>
        {!showExport
          ? <button className="btn btn-primary" onClick={()=>{setShowExport(true); setData(d=>({...d, lastExportAt: Date.now()}));}}>⬇️ Preparar exportación</button>
          : <>
              <textarea ref={exportRef} className="input mono" rows="5" readOnly value={exportText} onFocus={e=>e.target.select()} />
              <button className="btn btn-secondary" onClick={()=>{exportRef.current && exportRef.current.select();}}>📋 Seleccionar todo</button>
            </>}
      </div>

      <div className="card">
        <div className="card-title">⬆️ Restaurar desde respaldo</div>
        <p className="dim small">Pega aquí el texto que exportaste antes. Esto reemplaza lo que hay ahora.</p>
        {!showImport
          ? <button className="btn btn-secondary" onClick={()=>setShowImport(true)}>⬆️ Pegar respaldo</button>
          : <>
              <textarea className="input mono" rows="5" placeholder="Pega aquí el JSON exportado" value={importText} onChange={e=>setImportText(e.target.value)} />
              <div className="btn-row">
                <button className="btn btn-ghost" onClick={()=>{setShowImport(false); setImportText(""); setImportMsg("");}}>Cancelar</button>
                <button className="btn btn-primary" disabled={!importText.trim()} onClick={doImport}>Restaurar</button>
              </div>
              {importMsg && <p className="small">{importMsg}</p>}
            </>}
      </div>

      <div className="card card-danger-zone">
        <div className="card-title">⚠️ Reiniciar todo</div>
        <p className="dim small">Borra todos tus registros de esta app. Exporta un respaldo antes si no estás seguro.</p>
        <button className="btn btn-danger" onClick={doReset}>{resetArmed ? "Toca de nuevo para confirmar" : "🔄 Reiniciar datos"}</button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<HyroxTracker />);
</script>
</body>
</html>
